<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>รีวิวโฮมสเตย์ - ระบบท่องเที่ยวชุมชนชนเผ่า</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/Homestay/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/Homestay/homestay-review.css}" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <a th:href="@{/}" class="brand-logo-link">
            <div class="brand-logo">
                <img th:src="@{/images/logo5.png}" alt="Logo">
            </div>
            <span class="brand-text">ระบบท่องเที่ยวชุมชนชนเผ่า</span>
        </a>

        <div class="nav-right">
            <div class="profile-dropdown">
                <div class="profile-trigger">
                    <div class="avatar" th:text="${#strings.substring(ownername,0,2)}">สม</div>
                    <span class="owner-name" th:text="${ownername}">สมชาย ใจดี</span>
                    <i class="fas fa-chevron-down" style="font-size:.8rem; margin-left:5px; color:#fff;"></i>
                </div>
                <div class="dropdown-content">
                    <a th:href="@{/owner/profile-edit}"><i class="fas fa-user-edit"></i> แก้ไขโปรไฟล์</a>
                    <hr>
                    <a th:href="@{/owner/logout}" class="logout-item">
                        <i class="fas fa-right-from-bracket"></i> ออกจากระบบ
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="page">
        <div class="page-content">

            <div class="page-header-row">
                <a class="back-btn" th:href="@{/owner/homestays}" title="ย้อนกลับ">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h1 class="page-title">รีวิวโฮมสเตย์</h1>
            </div>

            <!-- ===== การ์ดสรุปโฮมสเตย์ ===== -->
            <div class="summary-card">
                <div class="summary-left">
                    <img th:src="${homestay != null and homestay.firstImage != null} ? ${homestay.firstImage} : '/images/homestay-placeholder.jpg'"
                        alt="รูปโฮมสเตย์">
                    <div>
                        <div class="name" th:text="${homestay != null ? homestay.homestay.homestayname : 'โฮมสเตย์'}">
                        </div>
                        <div class="meta" th:text="${homestay != null ? homestay.homestay.address : ''}">📍
                            ที่อยู่โฮมสเตย์</div>
                    </div>
                </div>
                <div class="summary-right">
                    <div class="score" th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">4.5</div>
                    <div class="stars">★★★★☆</div>
                    <div class="count">จาก <span th:text="${totalCount}">24</span> รีวิว</div>
                </div>
            </div>

            <!-- ===== เนื้อหา: กรอง + รายการรีวิว ===== -->
            <div class="reviews-layout">

                <!-- กรองรีวิว + รายการรีวิว -->
                <div class="reviews-main">

                    <div class="panel">
                        <div class="panel-title">กรองรีวิว</div>
                        <div class="filter-row">
                            <a class="filter-chip" th:href="@{/owner/homestay/{id}/reviews(id=${homestayId})}"
                                th:classappend="${selectedStar == null} ? 'active' : ''">
                                ทั้งหมด (<span th:text="${totalCount}"></span>)
                            </a>
                            <a class="filter-chip" th:each="s : ${#numbers.sequence(5, 1)}"
                                th:href="@{/owner/homestay/{id}/reviews(id=${homestayId}, star=${s})}"
                                th:classappend="${selectedStar != null and selectedStar == s} ? 'active' : ''">
                                <span th:text="${s} + ' ★'"></span>
                                (<span th:text="${starCounts.get(s)} != null ? ${starCounts.get(s)} : 0"></span>)
                            </a>
                        </div>
                    </div>

                    <!-- รายการรีวิว -->
                    <div>
                        <div th:if="${#lists.isEmpty(reviews)}" class="empty-state">
                            ยังไม่มีรีวิวในหมวดนี้
                        </div>

                        <div id="reviewList">
                            <div class="review-card" th:each="review, iter : ${reviews}">
                                <div class="review-head">
                                    <div class="avatar-circle" th:classappend="'avatar-' + ${iter.index % 5}"
                                        th:text="${#strings.substring(review.booking.member.firstname, 0, 1)} + ${#strings.substring(review.booking.member.lastname, 0, 1)}">

                                    </div>
                                    <div>
                                        <span class="reviewer-name"
                                            th:text="${review.booking.member.firstname} + ' ' + ${review.booking.member.lastname}"></span>
                                        <!-- <span class="verified-badge">✓ จองผ่านระบบ</span> -->
                                        <div class="review-meta"
                                            th:text="${#dates.format(review.reviewdate, 'd MMM yyyy')}"></div>
                                    </div>
                                </div>

                                <div class="review-stars">
                                    <span th:each="i : ${#numbers.sequence(1, 5)}"
                                        th:text="${i <= review.rating} ? '★' : '☆'"></span>
                                </div>

                                <div class="review-comment" th:text="${review.comment}">

                                </div>
                                <div th:if="${review.reviewimages != null and !#strings.isEmpty(review.reviewimages)}"
                                    class="review-images-row">
                                    <img th:each="imgPath : ${#strings.arraySplit(review.reviewimages, ',')}"
                                        class="review-image" th:src="@{${imgPath}}" alt="รูปรีวิว">
                                </div>
                            </div>
                        </div>

                        <!-- ── Pagination ── -->
                        <div id="paginationControls"
                            style="display:none; justify-content:center; align-items:center; gap:16px; margin-top:20px;">
                            <span id="prevPageBtn" class="filter-chip" onclick="goToPage(-1)">
                                <i class="fas fa-chevron-left"></i> ก่อนหน้า
                            </span>
                            <span id="pageInfo" style="font-size:13px; color:var(--text-muted); font-weight:600;">หน้า
                                1 / 1</span>
                            <span id="nextPageBtn" class="filter-chip" onclick="goToPage(1)">
                                ถัดไป <i class="fas fa-chevron-right"></i>
                            </span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- ─── FOOTER ─── -->
    <footer class="footer">
        <div class="footer-content">
            <span>© 2026 ระบบท่องเที่ยวชุมชนชนเผ่า</span>
            <span class="footer-right">
                Version 1.0 |
                <a href="#"><i class="fas fa-circle-question"></i> Help</a> |
                <a href="#" onclick="openContactModal()">
                    <i class="fas fa-headset"></i> ติดต่อแอดมิน
                </a>
            </span>
        </div>
    </footer>

    <script>
        const PAGE_SIZE = 6;
        let currentPage = 1;

        function paginate() {
            const cards = Array.from(document.querySelectorAll('#reviewList .review-card'));
            const totalPages = Math.max(1, Math.ceil(cards.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            cards.forEach(card => card.style.display = 'none');
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            cards.slice(start, end).forEach(card => card.style.display = '');

            const pagination = document.getElementById('paginationControls');
            pagination.style.display = (cards.length > PAGE_SIZE) ? 'flex' : 'none';
            document.getElementById('pageInfo').textContent = 'หน้า ' + currentPage + ' / ' + totalPages;
            document.getElementById('prevPageBtn').classList.toggle('disabled', currentPage <= 1);
            document.getElementById('nextPageBtn').classList.toggle('disabled', currentPage >= totalPages);
        }

        function goToPage(delta) {
            currentPage += delta;
            paginate();
        }

        document.addEventListener('DOMContentLoaded', paginate);
    </script>

</body>

</html>
