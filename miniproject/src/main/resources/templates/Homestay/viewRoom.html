<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>รายละเอียดประเภทห้องพัก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-dark:   #1e3a0f;
            --green-main:   #2d5a16;
            --green-accent: #3a7020;
            --green-light:  #e8f0df;
            --bg:           #f0ede6;
            --card:         #ffffff;
            --text:         #2c2c2c;
            --text-muted:   #888;
            --border:       #dde5d4;
            --price-bg:     #f0f7e8;
        }

        body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── Navbar ── */
        .navbar {
            background: var(--green-dark);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; height: 56px;
            position: sticky; top: 0; z-index: 100;
        }
        /* แก้ไขสี Navbar และฟอนต์ Brand ให้หนาขึ้น */
.navbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;           /* เว้นระยะห่างระหว่างไอคอนและข้อความ */
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;    /* เพิ่มความหนาของตัวอักษรให้เหมือนในรูป */
    font-size: 16px;     /* ปรับขนาดให้ดูพอดีกับแถบเมนู */
}

.navbar-brand i {
    font-size: 20px;     /* ปรับขนาดไอคอนภูเขาให้เด่นชัด */
}

/* เพิ่มเส้นแบ่งระหว่างเมนูกับชื่อผู้ใช้ (ถ้าต้องการให้เหมือนเป๊ะ) */
.nav-user { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    color: #fff; 
    font-size: 14px; 
    padding-left: 20px;
    border-left: 1px solid rgba(255,255,255,0.1); /* เส้นแบ่งจางๆ */
}

/* แก้ไขสี Avatar เป็นสีส้มตามรูป */
.avatar {
    width: 32px; 
    height: 32px; 
    border-radius: 50%; 
    background: #e67e22; /* สีส้มอมน้ำตาลตามรูป */
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-weight: 600; 
    font-size: 12px; 
    color: #fff;
}
        .nav-user { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 14px; }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%; background: #d4a017;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; color: #fff;
        }

        /* ── Layout ── */
        .container { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }

        /* ── Back ── */
        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--green-main); color: #fff;
            border: none; border-radius: 6px;
            padding: 7px 16px; font-size: 13.5px; font-family: inherit;
            cursor: pointer; text-decoration: none;
            margin-bottom: 20px; transition: background .18s;
        }
        .btn-back:hover { background: var(--green-accent); }

        /* ── Page header ── */
        .page-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            margin-bottom: 24px; gap: 16px;
        }
        .page-title h1 { font-size: 26px; font-weight: 700; }
        .page-title .room-id { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn-edit {
            display: inline-flex; align-items: center; gap: 6px;
            background: #fff; color: var(--green-main);
            border: 1.5px solid var(--green-main); border-radius: 6px;
            padding: 7px 16px; font-size: 13.5px; font-family: inherit;
            cursor: pointer; text-decoration: none; transition: background .18s; white-space: nowrap;
        }
        .btn-edit:hover { background: var(--green-light); }

        .btn-close {
            display: inline-flex; align-items: center; gap: 6px;
            background: #d9534f; color: #fff; border: none; border-radius: 6px;
            padding: 7px 16px; font-size: 13.5px; font-family: inherit;
            cursor: pointer; text-decoration: none; white-space: nowrap;
        }

        /* ── Main Grid ── */
        .main-grid { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
        .left-col { display: flex; flex-direction: column; gap: 14px; }

        /* ── Gallery ── */
        .gallery-wrap { border-radius: 12px; overflow: hidden; background: #ddd; }
        .gallery-main { position: relative; aspect-ratio: 4/3; overflow: hidden; }
        .gallery-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .no-image { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

        .gallery-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,.4); color: #fff; border: none; border-radius: 50%;
            width: 30px; height: 30px; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 2;
        }
        .gallery-arrow:hover { background: rgba(0,0,0,.65); }
        .gallery-arrow.prev { left: 8px; }
        .gallery-arrow.next { right: 8px; }
        .gallery-counter {
            position: absolute; bottom: 8px; right: 10px;
            background: rgba(0,0,0,.5); color: #fff;
            font-size: 11px; padding: 2px 8px; border-radius: 10px;
        }
        .gallery-thumbs { display: flex; gap: 6px; padding: 8px; background: #f0ede6; overflow-x: auto; }
        .gallery-thumbs img {
            width: 54px; height: 54px; object-fit: cover; border-radius: 6px;
            cursor: pointer; flex-shrink: 0; border: 2px solid transparent; opacity: .7;
            transition: border-color .15s, opacity .15s;
        }
        .gallery-thumbs img.active { border-color: var(--green-main); opacity: 1; }

        /* ── Price card ── */
        .price-card {
            background: var(--price-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 18px 20px; text-align: center;
        }
        .price-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .price-value { font-size: 30px; font-weight: 700; color: var(--green-dark); }
        .price-unit  { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* ── Cards ── */
        .right-col { display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .card-header {
            display: flex; align-items: center; gap: 8px;
            padding: 11px 18px; border-bottom: 1px solid var(--border);
            font-size: 14px; font-weight: 600; color: var(--green-dark);
            background: #f7fbf2;
        }
        .card-body { padding: 16px 18px; }

        /* ── Info grid ── */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
        .info-item label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .info-item .value { font-size: 14px; font-weight: 600; }
        .info-item.full { grid-column: 1 / -1; }

        .badge-status {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
        }
        .badge-open  { background: #d4f0c8; color: #1e7a10; }
        .badge-close { background: #fde8e8; color: #b32020; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

        .description-text { font-size: 13.5px; line-height: 1.8; }

        /* ── Facilities ── */
        .facility-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .facility-tag {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--green-light); border: 1px solid var(--border);
            color: var(--green-dark); border-radius: 8px;
            padding: 5px 14px; font-size: 13px; font-weight: 500;
        }

        /* ── Conditions ── */
        .condition-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .condition-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; line-height: 1.65; }
        .condition-list li::before { content: "*"; color: var(--green-main); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

        @media (max-width: 700px) {
            .main-grid { grid-template-columns: 1fr; }
            .info-grid { grid-template-columns: 1fr 1fr; }
            .page-header { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">
    <!-- เปลี่ยนไอคอนเป็นรูปภูเขาปกติ -->
    <i class="fas fa-mountain"></i> 
    <span>ระบบท่องเที่ยวชุมชนชนเผ่า</span>
</a>
    
    <div class="nav-user">
        <div class="avatar" th:text="${#strings.substring(ownername,0,2)}">นค</div>
        <div style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
            <span th:text="${ownername}"></span>
            <i class="fas fa-caret-down" style="font-size: 10px; opacity: 0.8;"></i>
        </div>
    </div>
</nav>

<div class="container">

    <a th:href="@{/owner/rooms(homestayid=${room.homestay.homestayid})}" class="btn-back">← ย้อนกลับ</a>

    <div class="page-header">
        <div class="page-title">
            <h1>รายละเอียดประเภทห้องพัก</h1>
            <div class="room-id" th:text="'roomTypeId: ' + ${room.roomtypeid}"></div>
        </div>
        <div class="header-actions">
            <a th:href="@{/editroom(roomtypeid=${room.roomtypeid})}" class="btn-edit">✏️ แก้ไขข้อมูล</a>
            
        </div>
    </div>

    <div class="main-grid">

        <!-- Left -->
        <div class="left-col">
            <div th:if="${imageList != null and !#lists.isEmpty(imageList)}" class="gallery-wrap">
                <div class="gallery-main">
                    <img id="mainImg" th:src="${imageList[0]}" alt="room"/>
                    <button th:if="${#lists.size(imageList) > 1}" class="gallery-arrow prev" onclick="prevImg()">&#8249;</button>
                    <button th:if="${#lists.size(imageList) > 1}" class="gallery-arrow next" onclick="nextImg()">&#8250;</button>
                    <div class="gallery-counter" id="imgCounter" th:if="${#lists.size(imageList) > 1}">
                        1 / <span th:text="${#lists.size(imageList)}"></span>
                    </div>
                </div>
                <div class="gallery-thumbs" th:if="${#lists.size(imageList) > 1}">
                    <img th:each="img,stat : ${imageList}"
                         th:src="${img}"
                         th:classappend="${stat.index == 0} ? 'active' : ''"
                         th:onclick="'goToImg(' + ${stat.index} + ')'"
                         alt="thumb"/>
                </div>
            </div>
            <div class="gallery-wrap" th:unless="${imageList != null and !#lists.isEmpty(imageList)}">
                <div class="gallery-main"><div class="no-image">ไม่มีรูปภาพ</div></div>
            </div>

            <div class="price-card">
                <div class="price-label">ราคาต่อคืน</div>
                <div class="price-value" th:text="${#numbers.formatDecimal(room.pricepernight,1,'COMMA',2,'POINT')} + ' ฿'">1,500.00 ฿</div>
                <div class="price-unit">ราคาสุทธิ / คืน</div>
            </div>
        </div>

        <!-- Right -->
        <div class="right-col">

            <div class="card">
                <div class="card-header">🏠 ข้อมูลประเภทห้องพัก</div>
                <div class="card-body">
                    <div class="info-grid">
                        <div class="info-item">
                            <label>ประเภทห้อง</label>
                            <div class="value" th:text="${room.typename}">บ้านพัก</div>
                        </div>
                        <div class="info-item">
                            <label>ประเภทเตียง</label>
                            <div class="value" th:text="${room.bedtype}">เตียงคู่</div>
                        </div>
                        <div class="info-item">
                            <label>สถานะ</label>
                            <span class="badge-status badge-open" th:if="${room.status == 'available'}">
                                <span class="dot"></span> เปิดจอง
                            </span>
                            <span class="badge-status badge-close" th:unless="${room.status == 'available'}">
                                <span class="dot"></span> ปิดการใช้งาน
                            </span>
                        </div>
                        <div class="info-item">
                            <label>จำนวนผู้เข้าพักสูงสุด</label>
                            <div class="value" th:text="${room.maxguest} + ' ท่าน'">4 ท่าน</div>
                        </div>
                        <div class="info-item">
                            <label>จำนวนห้องทั้งหมด</label>
                            <div class="value" th:text="${room.totalrooms} + ' หลัง'">5 หลัง</div>
                        </div>
                        <div class="info-item full" th:if="${room.description != null and room.description != ''}">
                            <label>คำอธิบาย</label>
                            <div class="description-text" th:text="${room.description}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" th:if="${facilities != null and !#lists.isEmpty(facilities)}">
                <div class="card-header">🏕️ สิ่งอำนวยความสะดวก</div>
                <div class="card-body">
                    <div class="facility-list">
                        <span th:each="f : ${facilities}" class="facility-tag">
                            <span th:text="${f == 'Wi-Fi'} ? '📶 Wi-Fi' :
                                           (${f == 'เครื่องปรับอากาศ'} ? '❄️ แอร์' :
                                           (${f == 'น้ำอุ่น'} ? '🚿 น้ำอุ่น' :
                                           (${f == 'ทีวี'} ? '📺 ทีวี' :
                                           (${f == 'อาหารเช้า'} ? '🍳 อาหารเช้า' :
                                           (${f == 'ที่จอดรถ'} ? '🚗 ที่จอดรถ' : ${f})))))">
                            </span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="card" th:if="${room.roomcondition != null and room.roomcondition != ''}">
                <div class="card-header">📋 เงื่อนไขการเข้าพัก</div>
                <div class="card-body">
                    <ul class="condition-list">
                        <li th:each="line : ${#strings.arraySplit(room.roomcondition, '\n')}"
                            th:if="${!#strings.isEmpty(#strings.trim(line))}"
                            th:text="${#strings.trim(line)}">
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    const images = /*[[${imageList}]]*/ [];
    let current = 0;
    const mainImg = document.getElementById('mainImg');
    const counter = document.getElementById('imgCounter');
    const thumbs  = document.querySelectorAll('.gallery-thumbs img');

    function goToImg(index) {
        if (!images || images.length === 0) return;
        current = (index + images.length) % images.length;
        mainImg.src = images[current];
        if (counter) counter.textContent = (current + 1) + ' / ' + images.length;
        thumbs.forEach((t, i) => t.classList.toggle('active', i === current));
    }
    function nextImg() { goToImg(current + 1); }
    function prevImg() { goToImg(current - 1); }
</script>

</body>
</html>
