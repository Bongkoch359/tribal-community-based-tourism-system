<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>แก้ไขข้อมูลห้องพัก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/Homestay/dashboard.css}" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-dark:  #2d5a27;
            --green-mid:   #3d7a35;
            --green-light: #5a9e50;
            --orange:      #e07b39;
            --orange-dark: #c5672a;
            --bg:          #f5f3ee;
            --card:        #ffffff;
            --border:      #d9d4c8;
            --text:        #2c2c2c;
            --text-muted:  #7a7060;
            --red:         #c0392b;
            --radius:      10px;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Navbar ── */
        .navbar {
            background: var(--green-dark);
            padding: 0 28px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand { color: #fff; font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .navbar-brand svg { width: 22px; height: 22px; }
        .navbar-user {
            display: flex; align-items: center; gap: 10px; color: #fff;
            font-size: .9rem; cursor: pointer;
        }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--orange);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .85rem; color: #fff;
        }

        /* ── Page wrapper ── */
        .page { max-width: 1140px; margin: 0 auto; padding: 28px 20px 60px; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--green-dark); color: #fff;
            border: none; border-radius: 8px;
            padding: 7px 16px; font-size: .875rem; font-family: inherit;
            cursor: pointer; text-decoration: none; margin-bottom: 18px;
            transition: background .2s;
        }
        .back-btn:hover { background: var(--green-mid); }

        .page-title { font-size: 1.65rem; font-weight: 700; color: var(--text); line-height: 1.2; }
        .page-subtitle { font-size: .85rem; color: var(--text-muted); margin-top: 4px; margin-bottom: 24px; }

        /* ── Grid ── */
        .layout { display: grid; grid-template-columns: 1fr 340px; gap: 22px; }
        @media(max-width: 860px) { .layout { grid-template-columns: 1fr; } }

        /* ── Card ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: .7rem; font-weight: 700; letter-spacing: .1em;
            text-transform: uppercase; color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px; margin-bottom: 18px;
        }

        /* ── Form ── */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
        .form-row.single { grid-template-columns: 1fr; }
        @media(max-width: 540px) { .form-row { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: .82rem; font-weight: 600; color: var(--text-muted); }
        label span.req { color: var(--orange); margin-left: 2px; }

        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap input, .input-wrap select, .input-wrap textarea {
            width: 100%; padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 7px; font-family: inherit; font-size: .92rem;
            background: #fafaf8; color: var(--text);
            transition: border-color .2s, box-shadow .2s; outline: none;
        }
        .input-wrap input:focus,
        .input-wrap select:focus,
        .input-wrap textarea:focus {
            border-color: var(--green-mid);
            box-shadow: 0 0 0 3px rgba(61,122,53,.12);
        }
        .input-wrap .unit {
            position: absolute; right: 11px;
            font-size: .8rem; color: var(--text-muted); pointer-events: none;
        }
        .input-wrap input.has-unit { padding-right: 46px; }
        textarea { resize: vertical; min-height: 90px; }

        /* status checkbox */
        .status-wrap { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 7px; background: #fafaf8; cursor: pointer; }
        .status-wrap input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--green-mid); cursor: pointer; }
        .status-label { font-size: .92rem; }

        /* ── Image section ── */
        .img-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .img-thumb {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1.5px solid var(--border);
        }
        .img-thumb img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .img-thumb .remove-img {
            position: absolute; top: 4px; right: 4px;
            width: 22px; height: 22px; border-radius: 50%;
            background: rgba(0,0,0,.55); color: #fff;
            border: none; font-size: .85rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            line-height: 1;
        }
        .img-thumb .remove-img:hover { background: var(--red); }

        .upload-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; padding: 12px;
            border: 2px dashed var(--border);
            border-radius: 8px; cursor: pointer;
            background: #fafaf8;
            font-size: .8rem; color: var(--text-muted);
            transition: border-color .2s, background .2s;
        }
        .upload-btn:hover { border-color: var(--green-mid); background: #f0f5ee; }
        .upload-btn svg { width: 24px; height: 24px; opacity: .6; }
        #fileInput { display: none; }

        /* ── Facilities pill/sticker style ── */
        .facilities-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .facility-item {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 8px 16px;
            border: 2px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            transition: border-color .15s, background .15s, box-shadow .15s;
            font-size: .88rem;
            background: #fff;
            user-select: none;
            white-space: nowrap;
        }
        .facility-item:hover {
            border-color: var(--green-mid);
            background: #f0f5ee;
        }
        .facility-item input[type=checkbox] {
            display: none; /* ซ่อน checkbox จริง ใช้ visual pill แทน */
        }
        .facility-item.checked {
            border-color: var(--green-mid);
            background: #edf4ec;
            box-shadow: 0 0 0 1px var(--green-mid);
        }
        .facility-item.checked .fac-icon-wrap {
            background: var(--green-mid);
            color: #fff;
        }
        .fac-icon-wrap {
            width: 26px; height: 26px; border-radius: 50%;
            background: #f0ece4;
            display: flex; align-items: center; justify-content: center;
            font-size: .95rem; flex-shrink: 0;
            transition: background .15s, color .15s;
        }
        .fac-label { font-weight: 500; color: var(--text); }

        /* ── Footer buttons ── */
        .footer-actions {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 12px; margin-top: 6px;
        }
        .btn-cancel {
            padding: 10px 24px; border-radius: 8px;
            border: 1.5px solid var(--border);
            background: #fff; color: var(--text);
            font-family: inherit; font-size: .92rem; cursor: pointer;
            transition: border-color .2s;
        }
        .btn-cancel:hover { border-color: #aaa; }
        .btn-save {
            padding: 10px 26px; border-radius: 8px;
            border: none; background: var(--orange);
            color: #fff; font-family: inherit; font-size: .92rem;
            font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            transition: background .2s, transform .1s;
        }
        .btn-save:hover { background: var(--orange-dark); }
        .btn-save:active { transform: scale(.98); }
        .btn-save:disabled { background: #ccc; cursor: not-allowed; }

        /* ── Toast ── */
        #toast {
            position: fixed; bottom: 28px; right: 28px; z-index: 9999;
            padding: 12px 20px; border-radius: 8px;
            font-size: .9rem; font-weight: 500;
            background: var(--green-dark); color: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,.18);
            opacity: 0; transform: translateY(12px);
            transition: opacity .3s, transform .3s;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateY(0); }
        #toast.error { background: var(--red); }

        /* loading overlay */
        #loadingOverlay {
            display: none; position: fixed; inset: 0; z-index: 9998;
            background: rgba(255,255,255,.6);
            align-items: center; justify-content: center;
        }
        #loadingOverlay.show { display: flex; }
        .spinner {
            width: 40px; height: 40px; border-radius: 50%;
            border: 4px solid var(--border);
            border-top-color: var(--green-mid);
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Navbar -->
<!-- ─── NAVBAR ─── -->
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">
        <i class="fas fa-mountain-sun me-2"></i> ระบบท่องเที่ยวชุมชนชนเผ่า
    </a>
    
    <div class="nav-right">
        <div class="profile-dropdown">
            <div class="profile-trigger">
                <div class="avatar" th:text="${#strings.substring(ownername,0,2)}">สม</div>
                <span class="owner-name" th:text="${ownername}">สมชาย ใจดี</span>
                <i class="fas fa-chevron-down" style="font-size:.8rem; margin-left:5px; color:#fff;"></i>
            </div>
            <div class="dropdown-content">
                <a th:href="@{/owner/profile-edit}"><i class="fas fa-user-edit"></i> แก้ไขโปรไฟล์</a>
                <hr>
                <a th:href="@{/owner/logout}" class="logout-item">
                    <i class="fas fa-right-from-bracket"></i> ออกจากระบบ
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Loading -->
<div id="loadingOverlay"><div class="spinner"></div></div>

<!-- Toast -->
<div id="toast"></div>

<div class="page">
    <!-- Back -->
    <a class="back-btn"
       th:href="@{/owner/rooms(homestayid=${homestayid})}">
        ← ย้อนกลับ
    </a>

    <div class="page-title">แก้ไขข้อมูลห้องพัก</div>
    <div class="page-subtitle" th:text="'roomTypeId: ' + ${room.roomtypeid}">roomTypeId: RT-1002</div>

    <div class="layout">
        <!-- ── LEFT COLUMN ── -->
        <div>
            <!-- รายละเอียดห้องพัก -->
            <div class="card">
                <div class="card-title">รายละเอียดข้อมูล (Roomtype Attributes)</div>

                <div class="form-row">
                    <!-- ประเภทที่พัก -->
                    <div class="form-group">
                        <label>ประเภทที่พัก <span class="req">*</span></label>
                        <div class="input-wrap">
                            <select id="typename">
                                <option value="" disabled>-- เลือกประเภทที่พัก --</option>
                                <option value="โดม"    th:selected="${room.typename == 'โดม'}">🔵 โดม</option>
                                <option value="เต็นท์" th:selected="${room.typename == 'เต็นท์'}">⛺ เต็นท์</option>
                                <option value="บ้านพัก" th:selected="${room.typename == 'บ้านพัก'}">🏡 บ้านพัก</option>
                            </select>
                        </div>
                    </div>
                    <!-- สถานะ -->
                    <div class="form-group">
                        <label>สถานะ <span class="req">*</span></label>
                        <div class="input-wrap">
                            <select id="statusSelect">
                                <option value="เปิดจอง"     th:selected="${room.status == 'เปิดจอง'}">✅ เปิดจอง</option>
                                <option value="ปิดปรับปรุง" th:selected="${room.status == 'ปิดปรับปรุง'}">🔧 ปิดปรับปรุง</option>
                                <option value="เต็ม"        th:selected="${room.status == 'เต็ม'}">🔴 เต็ม</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <!-- ประเภทเตียง -->
                    <div class="form-group">
                        <label>ประเภทเตียง <span class="req">*</span></label>
                        <div class="input-wrap">
                            <select id="bedtype">
                                <option value="" disabled>-- เลือกประเภทเตียง --</option>
                                <option value="เดี่ยว"      th:selected="${room.bedtype == 'เดี่ยว'}">เตียงเดี่ยว</option>
                                <option value="คู่"   th:selected="${room.bedtype == 'คู่'}">เตียงคู่</option>
                                <option value="ฟูกนอนพื้น"         th:selected="${room.bedtype == 'ฟูกนอนพื้น'}">ฟูกนอนพื้น</option>
                                
                            </select>
                        </div>
                    </div>
                    <!-- ราคาต่อคืน -->
                    <div class="form-group">
                        <label>ราคาต่อคืน <span class="req">*</span></label>
                        <div class="input-wrap">
                            <input type="number" id="pricepernight" class="has-unit" min="0"
                                   th:value="${room.pricepernight}"/>
                            <span class="unit">฿</span>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <!-- รองรับสูงสุด -->
                    <div class="form-group">
                        <label>รองรับสูงสุด <span class="req">*</span></label>
                        <div class="input-wrap">
                            <input type="number" id="maxguest" class="has-unit" min="1"
                                   th:value="${room.maxguest}"/>
                            <span class="unit">คน</span>
                        </div>
                    </div>
                    <!-- จำนวนห้องทั้งหมด -->
                    <div class="form-group">
                        <label>จำนวนห้องทั้งหมด <span class="req">*</span></label>
                        <div class="input-wrap">
                            <input type="number" id="totalrooms" class="has-unit" min="1"
                                   th:value="${room.totalrooms}"/>
                            <span class="unit">ห้อง</span>
                        </div>
                    </div>
                </div>

                <div class="form-row single">
                    <!-- คำอธิบาย -->
                    <div class="form-group">
                        <label>คำอธิบายที่พัก</label>
                        <div class="input-wrap">
                            <textarea id="description"
                                      th:text="${room.description}"
                                      placeholder="บรรยายลักษณะห้องพัก..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-row single">
                    <!-- เงื่อนไข -->
                    <div class="form-group">
                        <label>เงื่อนไขการเข้าพัก</label>
                        <div class="input-wrap">
                            <textarea id="roomcondition"
                                      th:text="${room.roomcondition}"
                                      placeholder="เช่น ห้ามสูบบุหรี่, Check-in 14:00..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── RIGHT COLUMN ── -->
        <div>
            <!-- รูปภาพ -->
            <div class="card">
                <div class="card-title">รูปภาพที่พัก</div>

                <div class="img-preview-grid" id="imgGrid">
                    <!-- รูปเดิมจาก server (Thymeleaf inject) -->
                    <th:block th:each="img : ${imageList}">
                        <div class="img-thumb existing-thumb">
                            <img th:src="${img}" alt="room image"/>
                            <button type="button" class="remove-img" onclick="removeThumb(this)">✕</button>
                        </div>
                    </th:block>
                </div>

                <label class="upload-btn" for="fileInput">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    เปลี่ยนรูปภาพ / เพิ่มรูปภาพ
                </label>
                <input type="file" id="fileInput" accept="image/*" multiple/>
                <p style="font-size:.75rem;color:var(--text-muted);margin-top:6px;">
                    รองรับ JPG, PNG ขนาดไม่เกิน 5 MB/รูป
                </p>
            </div>

            <!-- สิ่งอำนวยความสะดวก -->
            <div class="card">
                <div class="card-title">สิ่งอำนวยความสะดวก (Facilities)</div>
                <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:12px;">
                    เลือกสิ่งอำนวยความสะดวกที่มีให้บริการ
                </p>

                <div class="facilities-grid" id="facilitiesGrid">
                    <!-- Thymeleaf render pill checkbox แต่ละรายการ -->
                    <th:block th:each="fac : ${allFacilities}">
                        <label class="facility-item"
                               th:classappend="${checkedIds.contains(fac.facilitiesid)} ? ' checked' : ''"
                               th:data-name="${fac.facilitiesname}">
                            <input type="checkbox"
                                   th:value="${fac.facilitiesid}"
                                   th:checked="${checkedIds.contains(fac.facilitiesid)}"
                                   onchange="toggleFacilityStyle(this)"/>
                            <span class="fac-icon-wrap"
                                  th:attr="data-name=${fac.facilitiesname}">
                                <!-- icon จะถูกใส่โดย JS -->
                            </span>
                            <span class="fac-label" th:text="${fac.facilitiesname}">WiFi</span>
                        </label>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer buttons -->
    <div class="footer-actions">
        <button class="btn-cancel" type="button"
                th:onclick="|window.location.href='@{/owner/rooms(homestayid=${homestayid})}'|">
            ยกเลิก
        </button>
        <button class="btn-save" type="button" id="btnSave" onclick="submitEdit()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2">
                <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
            </svg>
            บันทึกการแก้ไข
        </button>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/

    // ─── ข้อมูลจาก server ────────────────────────────────────────────────────
    const ROOM_ID    = /*[[${room.roomtypeid}]]*/ '';
    const HOMESTAY_ID = /*[[${homestayid}]]*/ '';

    // ─── Facility highlight ───────────────────────────────────────────────────
    function toggleFacilityStyle(cb) {
        cb.closest('.facility-item').classList.toggle('checked', cb.checked);
    }

    // ─── Facility icon mapping ────────────────────────────────────────────────
    const FAC_ICONS = {
        'wifi':        '📶', 'wi-fi':      '📶', 'wi fi':      '📶',
        'แอร์':        '❄️', 'เครื่องปรับอากาศ': '❄️',
        'น้ำอุ่น':     '🚿', 'ฝักบัวน้ำอุ่น': '🚿',
        'พัดลม':       '🌀',
        'ที่จอดรถ':    '🚗', 'จอดรถ':     '🚗',
        
    };

    function getFacIcon(name) {
        const key = name.toLowerCase().trim();
        for (const [k, v] of Object.entries(FAC_ICONS)) {
            if (key.includes(k)) return v;
        }
        return '✨';
    }

    // ใส่ icon ให้ทุก pill ตอน DOM ready
    document.querySelectorAll('.fac-icon-wrap[data-name]').forEach(el => {
        el.textContent = getFacIcon(el.dataset.name);
    });

    // ─── รูปภาพ: ลบ thumb ────────────────────────────────────────────────────
    function removeThumb(btn) {
        btn.closest('.img-thumb').remove();
    }

    // ─── รูปภาพ: อัปโหลดใหม่ ─────────────────────────────────────────────────
    const fileInput = document.getElementById('fileInput');
    const imgGrid   = document.getElementById('imgGrid');

    fileInput.addEventListener('change', function () {
        const files = Array.from(this.files);
        files.forEach(file => {
            if (file.size > 5 * 1024 * 1024) {
                showToast('ไฟล์ ' + file.name + ' ใหญ่เกิน 5 MB', true);
                return;
            }
            const reader = new FileReader();
            reader.onload = e => {
                const thumb = document.createElement('div');
                thumb.className = 'img-thumb new-thumb';
                thumb.innerHTML =
                    `<img src="${e.target.result}" alt="new image"/>
                     <button type="button" class="remove-img" onclick="removeThumb(this)">✕</button>`;
                imgGrid.appendChild(thumb);
            };
            reader.readAsDataURL(file);
        });
        this.value = '';
    });

    // ─── Collect existing images (Base64 src จาก DOM) ────────────────────────
    function collectExistingImages() {
        const thumbs = imgGrid.querySelectorAll('.existing-thumb img');
        return Array.from(thumbs).map(img => img.src).join(',');
    }

    // ─── Collect new images ───────────────────────────────────────────────────
    function collectNewImages() {
        const thumbs = imgGrid.querySelectorAll('.new-thumb img');
        return Array.from(thumbs).map(img => img.src);
    }

    // ─── Collect checked facilities ──────────────────────────────────────────
    function collectFacilities() {
        return Array.from(
            document.querySelectorAll('#facilitiesGrid input[type=checkbox]:checked')
        ).map(cb => cb.value);
    }

    // ─── Validate ─────────────────────────────────────────────────────────────
    function validate() {
        const required = [
            { id: 'typename',     label: 'ประเภทที่พัก' },
            { id: 'bedtype',      label: 'ประเภทเตียง'  },
            { id: 'pricepernight',label: 'ราคาต่อคืน'   },
            { id: 'maxguest',     label: 'รองรับสูงสุด'  },
            { id: 'totalrooms',   label: 'จำนวนห้องทั้งหมด' },
        ];
        for (const f of required) {
            const el = document.getElementById(f.id);
            if (!el.value || el.value.trim() === '' || el.value === '0') {
                showToast('กรุณากรอก: ' + f.label, true);
                el.focus();
                return false;
            }
        }
        return true;
    }

    // ─── Submit ───────────────────────────────────────────────────────────────
    async function submitEdit() {
        if (!validate()) return;

        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        document.getElementById('loadingOverlay').classList.add('show');

        const payload = {
            roomtypeid:     ROOM_ID,
            typename:       document.getElementById('typename').value.trim(),
            bedtype:        document.getElementById('bedtype').value,
            pricepernight:  parseFloat(document.getElementById('pricepernight').value),
            maxguest:       parseInt(document.getElementById('maxguest').value),
            totalrooms:     parseInt(document.getElementById('totalrooms').value),
            description:    document.getElementById('description').value.trim(),
            roomcondition:  document.getElementById('roomcondition').value.trim(),
            status:         document.getElementById('statusSelect').value,
            facilitiesIds:  collectFacilities(),
            existingImages: collectExistingImages(),
            images:         collectNewImages(),
        };

        try {
            const res  = await fetch('/owner/room/edit', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(payload),
            });
            const data = await res.json();

            if (data.success) {
                showToast('บันทึกสำเร็จ ✓');
                setTimeout(() => {
                    window.location.href = '/owner/rooms?homestayid=' + HOMESTAY_ID;
                }, 1200);
            } else {
                showToast('เกิดข้อผิดพลาด: ' + (data.message || ''), true);
                btn.disabled = false;
            }
        } catch (err) {
            showToast('ไม่สามารถเชื่อมต่อ server', true);
            btn.disabled = false;
        } finally {
            document.getElementById('loadingOverlay').classList.remove('show');
        }
    }

    // ─── Toast helper ─────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className   = 'show' + (isError ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.className = ''; }, 3000);
    }
    /*]]>*/
</script>
</body>
