<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบ – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-950: #0a1f12;
      --green-900: #14321e;
      --green-800: #1a472a;
      --green-700: #215c35;
      --green-600: #2d7a4f;
      --green-500: #3d9e68;
      --green-400: #52b788;
      --green-200: #a7e3c3;
      --green-100: #d8f3dc;
      --green-50:  #f0faf4;
      --amber-700: #a16207;
      --amber-600: #c27b04;
      --amber-500: #e8960a;
      --neutral-800: #292524;
      --neutral-700: #44403c;
      --neutral-600: #57534e;
      --neutral-500: #78716c;
      --neutral-400: #a8a29e;
      --neutral-300: #d6d3d1;
      --neutral-200: #e7e5e4;
      --neutral-100: #f5f5f4;
      --neutral-50:  #fafaf9;
      --white: #ffffff;
      --navbar-h: 100px;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 24px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--neutral-50);
      color: var(--neutral-800);
      min-height: 100vh;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: 'Sarabun', sans-serif; cursor: pointer; }

    /* TOP BAR */
    .top-bar {
      background: var(--green-950);
      padding: 8px 5%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
    }
    .top-bar a {
      color: rgba(255,255,255,0.55);
      font-size: 14px; font-weight: 500;
      transition: color .15s;
      display: flex; align-items: center; gap: 5px;
    }
    .top-bar a:hover { color: #fff; }
    .top-bar a svg { width: 14px; height: 14px; }
    .top-bar-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.14); }

    /* NAVBAR */
    .navbar {
      background: var(--green-800);
      height: var(--navbar-h);
      display: flex;
      align-items: center;
      padding: 0 5%;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 16px rgba(0,0,0,0.28);
    }
    .navbar-brand {
      color: #fff; margin-right: auto;
      display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    }
    .brand-icon {
      width: 48px; height: 48px;
      background: var(--green-400);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(82,183,136,0.35);
    }
    .brand-icon svg { width: 26px; height: 26px; fill: white; }
    .brand-name { display: flex; flex-direction: column; }
    .brand-name-line1 { font-size: 20px; font-weight: 800; line-height: 1.15; color: #fff; }
    .brand-name-line2 { font-size: 13px; font-weight: 400; color: var(--green-200); opacity: .8; }

    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      color: rgba(255,255,255,0.80);
      font-size: 16px; font-weight: 600;
      padding: 10px 16px; border-radius: var(--r-sm);
      transition: background .15s, color .15s;
      white-space: nowrap;
      display: flex; align-items: center; gap: 7px;
    }
    .nav-link svg { width: 17px; height: 17px; opacity: .7; flex-shrink: 0; }
    .nav-link:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .nav-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.14); margin: 0 8px; }
    .auth-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .btn-register {
      background: var(--amber-500);
      border: none; color: #fff;
      border-radius: var(--r-md);
      padding: 10px 22px;
      font-size: 16px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
      transition: background .15s, transform .1s, box-shadow .15s;
      white-space: nowrap;
      box-shadow: 0 3px 12px rgba(232,150,10,0.40);
    }
    .btn-register:hover { background: var(--amber-600); box-shadow: 0 5px 20px rgba(232,150,10,0.48); }
    .btn-register:active { transform: scale(0.97); }
    .btn-register svg { width: 17px; height: 17px; }

    /* PAGE BODY */
    .page-body {
      min-height: calc(100vh - var(--navbar-h) - 38px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
    }

    /* FORM CARD */
    .form-card {
      background: #fff;
      border-radius: 18px;
      padding: 48px 52px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
      border: 1px solid var(--neutral-200);
    }

    .form-card-header { margin-bottom: 32px; text-align: center; }
    .form-card-header .header-icon {
      width: 60px; height: 60px;
      background: var(--green-50);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .form-card-header .header-icon svg {
      width: 28px; height: 28px;
      stroke: var(--green-800); fill: none; stroke-width: 1.8;
    }
    .form-card-header h1 { font-size: 26px; font-weight: 800; color: var(--neutral-800); margin-bottom: 6px; }
    .form-card-header p { font-size: 15px; color: var(--neutral-400); }

    /* ALERT */
    .alert {
      border-radius: 9px; padding: 13px 16px;
      font-size: 15px; margin-bottom: 22px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-error  { background: #fff3f3; border: 1px solid #fccaca; color: #b91c1c; }
    .alert-success{ background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .alert svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }

    /* FORM */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; font-weight: 700; color: #3a3a3a; margin-bottom: 7px; }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px;
      stroke: #bbb; fill: none; stroke-width: 1.8;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid var(--neutral-300);
      border-radius: 9px;
      padding: 13px 14px 13px 44px;
      font-size: 16px;
      font-family: 'Sarabun', sans-serif;
      color: var(--neutral-800);
      background: var(--neutral-50);
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .form-control:focus {
      border-color: var(--green-400);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(82,183,136,0.14);
    }
    .form-control::placeholder { color: #c0bdb8; font-weight: 400; }

    .form-control.input-error {
      border-color: #fca5a5;
      background: #fff8f8;
    }
    .form-control.input-error:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
    }

    /* SUBMIT */
    .btn-submit {
      width: 100%;
      background: var(--green-800);
      border: none; border-radius: 10px;
      padding: 15px;
      color: #fff; font-size: 18px; font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer; margin-top: 8px;
      transition: background .18s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-submit:hover { background: var(--green-900); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; }

    .form-footer {
      text-align: center; font-size: 15px;
      color: var(--neutral-400); margin-top: 24px;
    }
    .form-footer a { color: var(--green-600); font-weight: 700; }
    .form-footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .top-bar { display: none; }
      .navbar { height: auto; min-height: 70px; padding: 12px 5%; flex-wrap: wrap; gap: 10px; }
      .brand-name-line2 { display: none; }
      .form-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
    </svg>
    ภาษาไทย
  </a>
  <div class="top-bar-divider"></div>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    ช่วยเหลือ
  </a>
  <div class="top-bar-divider"></div>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    การจองของฉัน
  </a>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="/search">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M3 17l6-8 4 5 3-3 5 6H3z"/></svg>
    </div>
    <div class="brand-name">
      <span class="brand-name-line1">ระบบท่องเที่ยวชุมชนเผ่า</span>
      <span class="brand-name-line2">Tribal Community Tourism</span>
    </div>
  </a>

  <div class="nav-links">
    <a href="/search" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      หน้าแรก
    </a>
    <a th:href="@{/tribe-info}" href="#" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>
      </svg>
      ข้อมูลชนเผ่า
    </a>
    <a href="/about" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4M12 8h.01"/>
      </svg>
      เกี่ยวกับเรา
    </a>
  </div>

  <div class="nav-divider"></div>

  <div class="auth-group">
    <a href="/member/register" class="btn-register">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
      </svg>
      สมัครสมาชิก
    </a>
  </div>
</nav>

<!-- PAGE -->
<div class="page-body">
  <div class="form-card">

    <div class="form-card-header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <h1>เข้าสู่ระบบสมาชิก</h1>
      <p>ยินดีต้อนรับสู่ระบบท่องเที่ยวชุมชนชนเผ่า</p>
    </div>

    <!-- Server-side Alerts (Thymeleaf) -->
    <div th:if="${errorMessage}" class="alert alert-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span th:text="${successMessage}"></span>
    </div>

    <!-- Client-side Alert (JS) -->
    <div id="js-alert" class="alert alert-error" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="js-alert-msg"></span>
    </div>

    <!-- FORM -->
    <form th:action="@{/member/login}" method="post" id="login-form" novalidate>

      <div class="form-group">
        <label class="form-label">อีเมล</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <input class="form-control" type="email" name="email" id="email" placeholder="example@email.com"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input class="form-control" type="password" name="password" id="password" placeholder="กรอกรหัสผ่าน"/>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        เข้าสู่ระบบ
      </button>
    </form>

    <div class="form-footer">
      ยังไม่มีบัญชี? <a href="/member/register">สมัครสมาชิกฟรี</a>
    </div>

  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    const email    = document.getElementById('email');
    const password = document.getElementById('password');

    email.classList.remove('input-error');
    password.classList.remove('input-error');
    hideAlert();

    // Flow 3.1 — ไม่กรอกข้อมูล
    if (!email.value.trim() || !password.value.trim()) {
      e.preventDefault();
      if (!email.value.trim())    email.classList.add('input-error');
      if (!password.value.trim()) password.classList.add('input-error');
      showAlert('กรุณากรอกอีเมลและรหัสผ่าน');
      return;
    }
  });

  function showAlert(msg) {
    var box = document.getElementById('js-alert');
    document.getElementById('js-alert-msg').textContent = msg;
    box.style.display = 'flex';
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideAlert() {
    document.getElementById('js-alert').style.display = 'none';
  }
</script>

</body>
</html>
