<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบ – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Member/login.css}" href="../static/css/Member/login.css">
</head>
  
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
    </svg>
    ภาษาไทย
  </a>
  <div class="top-bar-divider"></div>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    ช่วยเหลือ
  </a>
  <div class="top-bar-divider"></div>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    การจองของฉัน
  </a>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="/search">
    <div class="brand-logo">
      <img th:src="@{/images/logo5.png}" src="../static/images/logo5.png" alt="Logo">
    </div>
   <span class="brand-text">ชนเผ่าพาเที่ยว</span>
  </a>

  <div class="nav-links">
    <a href="/search" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      หน้าแรก
    </a>
    <a th:href="@{/tribe-info}" href="#" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>
      </svg>
      ข้อมูลชนเผ่า
    </a>
   
  </div>

  <div class="nav-divider"></div>

  <div class="auth-group">
    <a href="/member/register" class="btn-register">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
      </svg>
      สมัครสมาชิก
    </a>
  </div>
</nav>

<!-- PAGE -->
<div class="page-body">
  <div class="form-card">

    <div class="form-card-header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <h1>เข้าสู่ระบบสมาชิก</h1>
      <p>ยินดีต้อนรับสู่ระบบท่องเที่ยวชุมชนชนเผ่า</p>
    </div>

    <!-- Server-side Alerts (Thymeleaf) -->
    <div th:if="${errorMessage}" class="alert alert-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span th:text="${successMessage}"></span>
    </div>

    <!-- Client-side Alert (JS) -->
    <div id="js-alert" class="alert alert-error" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="js-alert-msg"></span>
    </div>

    <!-- FORM -->
    <form th:action="@{/member/login}" method="post" id="login-form" novalidate>

      <div class="form-group">
        <label class="form-label">อีเมล</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <input class="form-control" type="email" name="email" id="email" placeholder="example@email.com"/>
        </div>
      </div>

<div class="form-group">
  <label class="form-label">รหัสผ่าน</label>

  <div class="input-wrap password-wrap">
    <svg class="input-icon" viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0110 0v4"/>
    </svg>

    <input
      class="form-control"
      type="password"
      name="password"
      id="password"
      placeholder="กรอกรหัสผ่าน"
    />

    <button type="button" class="toggle-password"
            onclick="togglePassword()" aria-label="แสดงรหัสผ่าน">
      <svg id="eye-icon" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</div>

      <button type="submit" class="btn-submit">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        เข้าสู่ระบบ
      </button>
    </form>

    <div class="form-footer">
      ยังไม่มีบัญชี? <a href="/member/register">สมัครสมาชิกฟรี</a>
    </div>

  </div>
</div>

<script th:src="@{/js/Member/login.js}" src="../static/js/Member/login.js"></script>

</body>
</html>
