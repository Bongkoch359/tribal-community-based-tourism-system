<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>สมัครสมาชิก – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── สีเดิมของหน้านี้ (ใช้กับฟอร์ม/ปุ่ม submit ฯลฯ — ไม่แตะต้อง) ── */
      --green-950: #0a1f12;
      --green-900: #14321e;
      --green-800: #1a472a;
      --green-700: #215c35;
      --green-600: #2d7a4f;
      --green-400: #52b788;
      --green-200: #a7e3c3;
      --green-50:  #f0faf4;
      --amber-600: #c27b04;
      --amber-500: #e8960a;
      --neutral-800: #292524;
      --neutral-600: #57534e;
      --neutral-400: #a8a29e;
      --neutral-300: #d6d3d1;
      --neutral-200: #e7e5e4;
      --neutral-50:  #fafaf9;
      --white: #ffffff;
      --navbar-h: 100px;

      /* ── สีเฉพาะสำหรับ NAV/โลโก้ — ก็อปมาจากหน้า search (theme ป่า-ไม้-อำพัน) ── */
      --nav-green-950: #0f2114;
      --nav-green-900: #16311d;
      --nav-green-800: #1c4026;
      --nav-green-200: #bfdec8;
      --nav-green-50:  #f4faf5;
      --nav-amber-600: #b9790c;
      --nav-amber-500: #d68f14;
      --nav-amber-400: #e4a53a;
      --nav-paper: #fffdf8;
      --nav-neutral-200: #e4dac2;
      --nav-neutral-500: #8a7a63;
      --nav-neutral-700: #524533;
      --nav-neutral-800: #3a2f21;
      --nav-cream-100: #fbf6ea;
      --nav-cream-50:  #f6efdd;
      --nav-paper: #fffdf8;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--nav-cream-100);
      color: var(--neutral-800);
      min-height: 100vh;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: 'Sarabun', sans-serif; cursor: pointer; }

    /* ══════════════════ TOP BAR (ธีม search) ══════════════════ */
    .top-bar {
      background: var(--nav-green-950);
      padding: 7px 5%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
    }
    .top-bar a {
      color: rgba(255,255,255,0.55);
      font-size: 13.5px; font-weight: 500;
      transition: color .15s;
      display: flex; align-items: center; gap: 5px;
    }
    .top-bar a:hover { color: var(--nav-amber-400); }
    .top-bar a svg { width: 14px; height: 14px; }
    .top-bar-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.14); }

    /* ══════════════════ NAVBAR (ธีม search) ══════════════════ */
    .navbar {
      background: var(--nav-green-900);
      background-image: linear-gradient(180deg, var(--nav-green-800), var(--nav-green-900));
      height: var(--navbar-h);
      display: flex;
      align-items: center;
      padding: 0 5%;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 18px rgba(15,33,20,.35);
      border-bottom: 3px solid var(--nav-amber-500);
    }
    .navbar-brand {
      color: #fff; margin-right: auto;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }

    /* โลโก้แบบรูปภาพ เหมือนหน้า search */
    .brand-logo {
      width: 130px; height: 100px; flex-shrink: 0;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }

    .brand-name { display: flex; flex-direction: column; }
    .brand-name-line1 { font-size: 22px; font-weight: 700; line-height: 1; color: #fff; }
    .brand-name-line2 { font-size: 12px; font-weight: 400; color: var(--nav-green-200); margin-top: 4px; opacity: .9; }

    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      color: rgba(255,255,255,.82);
      font-size: 16px; font-weight: 600;
      padding: 10px 16px; border-radius: 8px;
      transition: background .15s, color .15s;
      white-space: nowrap;
      display: flex; align-items: center; gap: 7px;
    }
    .nav-link svg { width: 17px; height: 17px; opacity: .75; flex-shrink: 0; }
    .nav-link:hover { background: rgba(255,255,255,.10); color: var(--nav-amber-400); }

    .nav-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.14); margin: 0 8px; }

    .auth-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    /* ปุ่ม "เข้าสู่ระบบ" ในหน้านี้ (ไม่มี dropdown) — restyle ให้เข้าธีม search */
    .btn-login {
      background: rgba(255,255,255,0.10);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 100px;
      padding: 9px 20px 9px 9px;
      font-size: 16px; font-weight: 600;
      display: flex; align-items: center; gap: 9px;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn-login:hover { background: rgba(255,255,255,0.18); border-color: var(--nav-amber-400); }
    .btn-login:active { transform: scale(0.97); }
    .btn-login .icon-user {
      width: 30px; height: 30px;
      background: var(--nav-amber-500);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-login .icon-user svg { width: 15px; height: 15px; }

    /* ══════════════════ PAGE LAYOUT / ฟอร์ม (เดิมทั้งหมด — ไม่แตะ) ══════════════════ */
    .page-body {
      min-height: calc(100vh - var(--navbar-h) - 38px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 24px 64px;
    }

    .form-card {
      background: var(--nav-paper);
      border-radius: 18px;
      padding: 44px 48px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 14px 40px rgba(59,36,21,0.14), 0 4px 12px rgba(59,36,21,0.06);
      border: 1px solid var(--nav-neutral-200);
    }

    .form-card-header { margin-bottom: 32px; }
    .form-card-header h1 { font-size: 28px; font-weight: 800; color: var(--neutral-800); margin-bottom: 6px; }
    .form-card-header p { font-size: 16px; color: var(--neutral-400); }

    /* ALERT */
    .alert {
      border-radius: 9px; padding: 13px 16px;
      font-size: 15px; margin-bottom: 22px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-error  { background: #fff3f3; border: 1px solid #fccaca; color: #b91c1c; }
    .alert-success{ background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .alert svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }

    /* SECTION LABEL */
    .sec-label {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 700; color: var(--neutral-400);
      letter-spacing: .8px; text-transform: uppercase;
      margin: 6px 0 20px;
    }
    .sec-label::before, .sec-label::after {
      content: ''; flex: 1; height: 1px; background: var(--neutral-200);
    }

    .row-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; font-weight: 700; color: #3a3a3a; margin-bottom: 7px; }
    .req { color: #e53e3e; margin-left: 3px; }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px;
      stroke: #bbb; fill: none; stroke-width: 1.8;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid var(--neutral-300);
      border-radius: 9px;
      padding: 12px 14px 12px 44px;
      font-size: 16px;
      font-family: 'Sarabun', sans-serif;
      color: var(--neutral-800);
      background: var(--neutral-50);
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .form-control:focus {
      border-color: var(--green-400);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(82,183,136,0.14);
    }
    .form-control::placeholder { color: #c0bdb8; font-weight: 400; }

    .form-control.input-error {
      border-color: #fca5a5;
      background: #fff8f8;
    }
    .form-control.input-error:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
    }

    .btn-submit {
      width: 100%;
      background: var(--green-800);
      border: none; border-radius: 10px;
      padding: 15px;
      color: #fff; font-size: 18px; font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer; margin-top: 6px;
      transition: background .18s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-submit:hover { background: var(--green-900); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; }

    .form-footer {
      text-align: center; font-size: 15px;
      color: var(--neutral-400); margin-top: 22px;
    }
    .form-footer a { color: var(--green-600); font-weight: 700; }
    .form-footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .top-bar { display: none; }
      .navbar { height: auto; min-height: 70px; padding: 12px 5%; flex-wrap: wrap; gap: 10px; }
      .brand-name-line2 { display: none; }
      .form-card { padding: 28px 20px; }
      .row-two { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
    </svg>
    ภาษาไทย
  </a>
  <div class="top-bar-divider"></div>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    ช่วยเหลือ
  </a>
  <div class="top-bar-divider"></div>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    การจองของฉัน
  </a>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="/search">
    <div class="brand-logo">
      <img th:src="@{/images/logo3.png}" src="../static/images/logo3.png" alt="Logo">
    </div>
    <div class="brand-name">
      <span class="brand-name-line1">ระบบท่องเที่ยวชุมชนชนเผ่า</span>
      <span class="brand-name-line2">Tribal Community-Based Tourism System</span>
    </div>
  </a>

  <div class="nav-links">
    <a href="/search" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      หน้าแรก
    </a>
    <a th:href="@{/tribe-info}" href="#" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>
      </svg>
      ข้อมูลชนเผ่า
    </a>
    <a href="/about" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4M12 8h.01"/>
      </svg>
      เกี่ยวกับเรา
    </a>
  </div>

  <div class="nav-divider"></div>

  <div class="auth-group">
    <a href="/member/login" class="btn-login">
      <span class="icon-user">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
        </svg>
      </span>
      เข้าสู่ระบบ
    </a>
  </div>
</nav>

<!-- PAGE -->
<div class="page-body">
  <div class="form-card">

    <div class="form-card-header">
      <h1>สมัครสมาชิก</h1>
      <p>กรอกข้อมูลด้านล่างเพื่อสร้างบัญชีใหม่</p>
    </div>

    <!-- Server-side Alerts (Thymeleaf) -->
    <div th:if="${errorMessage}" class="alert alert-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span th:text="${successMessage}"></span>
    </div>

    <!-- Client-side Alert (JS) — ซ่อนไว้ก่อน แสดงเมื่อ JS เจอ error -->
    <div id="js-alert" class="alert alert-error" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="js-alert-msg"></span>
    </div>

    <form th:action="@{/member/register}" method="post" id="register-form" novalidate>

      <div class="sec-label">ข้อมูลส่วนตัว</div>

      <div class="row-two">
        <div class="form-group">
          <label class="form-label">ชื่อ <span class="req">*</span></label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="form-control" type="text" name="firstname" id="firstname" placeholder="ชื่อ"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">นามสกุล <span class="req">*</span></label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="form-control" type="text" name="lastname" id="lastname" placeholder="นามสกุล"/>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">อีเมล <span class="req">*</span></label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <input class="form-control" type="email" name="email" id="email" placeholder="example@email.com"/>
        </div>
      </div>

      <div class="row-two">
        <div class="form-group">
          <label class="form-label">เบอร์โทรศัพท์</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.22 1.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.9.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.13 6.13l1.27-1.27a2 2 0 012.11-.45c.91.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            <input class="form-control" type="tel" name="phone" placeholder="0xx-xxx-xxxx"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">วันเกิด</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <input class="form-control" type="date" name="birthdate"/>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">ที่อยู่</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 21c-4-4-7-7.5-7-10.5a7 7 0 1114 0c0 3-3 6.5-7 10.5z"/><circle cx="12" cy="10" r="2"/></svg>
          <input class="form-control" type="text" name="address" placeholder="กรอกที่อยู่"/>
        </div>
      </div>

      <div class="sec-label">ตั้งรหัสผ่าน</div>

      <div class="form-group">
        <label class="form-label">รหัสผ่าน <span class="req">*</span></label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input class="form-control" type="password" name="password" id="password" placeholder="กรอกรหัสผ่าน"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">ยืนยันรหัสผ่าน <span class="req">*</span></label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input class="form-control" type="password" name="confirmPassword" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง"/>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        สมัครสมาชิก
      </button>
    </form>

    <div class="form-footer">
      มีบัญชีแล้ว? <a href="/member/login">เข้าสู่ระบบ</a>
    </div>

  </div>
</div>

<script>
  document.getElementById('register-form').addEventListener('submit', function(e) {
    const fields = {
      firstname:       document.getElementById('firstname'),
      lastname:        document.getElementById('lastname'),
      email:           document.getElementById('email'),
      password:        document.getElementById('password'),
      confirmPassword: document.getElementById('confirmPassword')
    };

    Object.values(fields).forEach(el => el.classList.remove('input-error'));
    hideAlert();

    // 1. ช่องบังคับว่างไหม
    var emptyFound = false;
    Object.values(fields).forEach(el => {
      if (!el.value.trim()) {
        el.classList.add('input-error');
        emptyFound = true;
      }
    });
    if (emptyFound) {
      e.preventDefault();
      showAlert('กรุณากรอกข้อมูลให้ถูกต้อง');
      return;
    }

    // 2. เบอร์โทรต้องเป็นตัวเลข 10 หลัก (ถ้ากรอก)
    const phone = document.querySelector('[name="phone"]').value.trim();
    if (phone && !/^[0-9]{10}$/.test(phone)) {
      document.querySelector('[name="phone"]').classList.add('input-error');
      e.preventDefault();
      showAlert('กรุณากรอกเบอร์โทรให้ถูกต้อง (ตัวเลข 10 หลัก)');
      return;
    }

    // 3. รหัสผ่านต้องมีอย่างน้อย 6 ตัว
    if (fields.password.value.length < 6) {
      fields.password.classList.add('input-error');
      e.preventDefault();
      showAlert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
      return;
    }

    // 4. รหัสผ่านไม่ตรงกัน
    if (fields.password.value !== fields.confirmPassword.value) {
      fields.password.classList.add('input-error');
      fields.confirmPassword.classList.add('input-error');
      e.preventDefault();
      showAlert('รหัสผ่านไม่ตรงกัน');
      return;
    }
  });

  function showAlert(msg) {
    var box = document.getElementById('js-alert');
    document.getElementById('js-alert-msg').textContent = msg;
    box.style.display = 'flex';
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideAlert() {
    document.getElementById('js-alert').style.display = 'none';
  }
</script>

</body>
</html>
