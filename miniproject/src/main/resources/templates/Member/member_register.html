<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>สมัครสมาชิก – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #f4f6f3;
      color: #1e2d1a;
      min-height: 100vh;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAVBAR ─────────────────────────────── */
    .navbar {
      background: #1e4d2b;
      height: 100px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      justify-content: space-between;
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .brand-logo {
      width: 52px; height: 52px;
      background: #52b788;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-logo svg { width: 28px; height: 28px; fill: #fff; }

    .brand-text { display: flex; flex-direction: column; gap: 1px; }
    .brand-title {
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .brand-sub {
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 400;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-right a {
      color: rgba(255,255,255,0.75);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 8px;
      transition: background .15s, color .15s;
    }
    .nav-right a:hover { background: rgba(255,255,255,0.10); color: #fff; }
    .nav-btn-register {
      background: #f59e0b !important;
      color: #fff !important;
      font-weight: 700 !important;
      padding: 9px 22px !important;
      border-radius: 8px !important;
    }
    .nav-btn-register:hover { background: #d97706 !important; }

    /* ─── PAGE LAYOUT ─────────────────────────── */
    .page-body {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 24px 64px;
    }

    /* FORM AREA */
    .form-area {
      width: 100%;
      max-width: 560px;
    }

    .form-card {
      background: #fff;
      border-radius: 18px;
      padding: 44px 48px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
      border: 1px solid #e8e6e0;
    }

    .form-card-header { margin-bottom: 32px; }
    .form-card-header h1 {
      font-size: 28px; font-weight: 800;
      color: #1e2d1a; margin-bottom: 6px;
    }
    .form-card-header p { font-size: 16px; color: #888; }

    /* ALERT */
    .alert {
      border-radius: 9px; padding: 13px 16px;
      font-size: 15px; margin-bottom: 22px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-error  { background: #fff3f3; border: 1px solid #fccaca; color: #b91c1c; }
    .alert-success{ background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .alert svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }

    /* SECTION LABEL */
    .sec-label {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 700; color: #999;
      letter-spacing: .8px; text-transform: uppercase;
      margin: 6px 0 20px;
    }
    .sec-label::before, .sec-label::after {
      content: ''; flex: 1; height: 1px; background: #ede9e4;
    }

    /* GRID ROW */
    .row-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 14px; font-weight: 700;
      color: #3a3a3a; margin-bottom: 7px;
    }
    .req { color: #e53e3e; margin-left: 3px; }

    /* INPUT */
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px;
      stroke: #bbb; fill: none; stroke-width: 1.8;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 9px;
      padding: 12px 14px 12px 44px;
      font-size: 16px;
      font-family: 'Sarabun', sans-serif;
      color: #1e2d1a;
      background: #fafaf9;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .form-control.no-icon { padding-left: 14px; }
    .form-control:focus {
      border-color: #52b788;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(82,183,136,0.14);
    }
    .form-control::placeholder { color: #c0bdb8; font-weight: 400; }

    /* SUBMIT */
    .btn-submit {
      width: 100%;
      background: #1e4d2b;
      border: none; border-radius: 10px;
      padding: 15px;
      color: #fff; font-size: 18px; font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer; margin-top: 6px;
      transition: background .18s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-submit:hover { background: #14321e; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; }

    /* FOOTER LINK */
    .form-footer {
      text-align: center;
      font-size: 15px; color: #888;
      margin-top: 22px;
    }
    .form-footer a {
      color: #2d6a4f; font-weight: 700; text-decoration: none;
    }
    .form-footer a:hover { text-decoration: underline; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .navbar { padding: 0 20px; height: auto; min-height: 80px; }
      .form-card { padding: 28px 20px; }
      .row-two { grid-template-columns: 1fr; gap: 0; }
      .brand-sub { display: none; }
    }
  </style>
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────── -->
<nav class="navbar">
  <a class="nav-brand" href="/search">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24"><path d="M3 17l6-8 4 5 3-3 5 6H3z"/></svg>
    </div>
    <div class="brand-text">
      <span class="brand-title">ระบบท่องเที่ยวชุมชนเผ่า</span>
      <span class="brand-sub">Tribal Community Tourism</span>
    </div>
  </a>
  <div class="nav-right">
    <a href="/search">หน้าแรก</a>
    <a href="/tribes">ชนเผ่า</a>
    <a href="/member/login" class="nav-btn-register">เข้าสู่ระบบ</a>
  </div>
</nav>

<!-- ── PAGE ───────────────────────────────────────── -->
<div class="page-body">

  <!-- FORM -->
  <div class="form-area">
    <div class="form-card">

      <div class="form-card-header">
        <h1>สมัครสมาชิก</h1>
        <p>กรอกข้อมูลด้านล่างเพื่อสร้างบัญชีใหม่</p>
      </div>

      <!-- Alerts -->
      <div th:if="${errorMessage}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span th:text="${errorMessage}"></span>
      </div>
      <div th:if="${successMessage}" class="alert alert-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span th:text="${successMessage}"></span>
      </div>

      <form th:action="@{/member/register}" method="post">

        <!-- ── ข้อมูลส่วนตัว ────────────── -->
        <div class="sec-label">ข้อมูลส่วนตัว</div>

        <div class="row-two">
          <div class="form-group">
            <label class="form-label">ชื่อ <span class="req">*</span></label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="form-control" type="text" name="firstname" placeholder="ชื่อ" required/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">นามสกุล <span class="req">*</span></label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="form-control" type="text" name="lastname" placeholder="นามสกุล" required/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">อีเมล <span class="req">*</span></label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <input class="form-control" type="email" name="email" placeholder="example@email.com" required/>
          </div>
        </div>

        <div class="row-two">
          <div class="form-group">
            <label class="form-label">เบอร์โทรศัพท์</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.22 1.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.9.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.13 6.13l1.27-1.27a2 2 0 012.11-.45c.91.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
              <input class="form-control" type="tel" name="phone" placeholder="0xx-xxx-xxxx"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">วันเกิด</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <input class="form-control" type="date" name="birthdate"/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">ที่อยู่</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 21c-4-4-7-7.5-7-10.5a7 7 0 1114 0c0 3-3 6.5-7 10.5z"/><circle cx="12" cy="10" r="2"/></svg>
            <input class="form-control" type="text" name="address" placeholder="กรอกที่อยู่"/>
          </div>
        </div>

        <!-- ── ตั้งรหัสผ่าน ──────────────── -->
        <div class="sec-label">ตั้งรหัสผ่าน</div>

        <div class="form-group">
          <label class="form-label">รหัสผ่าน <span class="req">*</span></label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input class="form-control" type="password" name="password" placeholder="กรอกรหัสผ่าน" required/>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">ยืนยันรหัสผ่าน <span class="req">*</span></label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input class="form-control" type="password" name="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง" required/>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          สมัครสมาชิก
        </button>
      </form>

      <div class="form-footer">
        มีบัญชีแล้ว? <a href="/member/login">เข้าสู่ระบบ</a>
      </div>

    </div>
  </div>

</div>
</body>
</html>
