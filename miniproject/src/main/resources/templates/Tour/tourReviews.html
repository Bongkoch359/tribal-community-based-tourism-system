<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รีวิวทัวร์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green-dark: #3a7d1e;
            --green-mid: #65a30d;
            --green-light: #d9f99d;
            --amber: #65a30d;
            --amber-hover: #4d7c0a;
            --bg-page: #f3fae8;
            --bg-card: #ffffff;
            --bg-hero: #f4f1e7;
            --border: #e2ddd4;
            --text-main: #1c1c1a;
            --text-muted: #6b6b68;
            --text-hint: #9a9a96;
            --radius-card: 12px;
            --radius-sm: 6px;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.07);
            --red: #c0392b;
            --white: #ffffff;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ── Navbar ── */
        .navbar {
            background: var(--green-dark);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            height: 83px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .25);
        }

        .nav-dropdown {
            position: relative;
            margin-left: auto;
        }

        .nav-dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, .85);
            font-size: .92rem;
            font-weight: 500;
            cursor: pointer;
            padding: .4rem .6rem;
            border-radius: 8px;
            transition: background .2s;
            user-select: none;
        }

        .nav-dropdown-trigger:hover {
            background: rgba(255, 255, 255, .1);
        }

        .nav-dropdown-trigger .chevron {
            font-size: .75rem;
            color: rgba(255, 255, 255, .6);
            transition: transform .2s;
        }

        .nav-dropdown:hover .chevron {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .15);
            border: 1px solid #e8e8e8;
            min-width: 200px;
            padding: 6px 0;
            z-index: 200;
        }

        .nav-dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-header {
            padding: .7rem 1rem .5rem;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 4px;
        }

        .dropdown-header .d-name {
            font-size: .88rem;
            font-weight: 700;
            color: #1a2e1c;
        }

        .dropdown-header .d-role {
            font-size: .78rem;
            color: #6b7c6e;
            margin-top: 1px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: .65rem;
            padding: .6rem 1rem;
            font-size: .88rem;
            color: #333;
            text-decoration: none;
        }

        .dropdown-item:hover {
            background: #eefcda;
            color: var(--green-dark);
        }

        .dropdown-divider {
            border-top: 1px solid #f0f0f0;
            margin: 4px 0;
        }

        .dropdown-item.logout {
            color: #c0392b;
        }

        .nav-avatar {
            width: 36px;
            height: 36px;
            background: var(--amber);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .85rem;
            font-weight: 700;
            color: #fff;
        }

        .brand-logo-link {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin-right: auto;
            text-decoration: none;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .brand-logo img {
            height: 75px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            display: block;
        }

        .brand-text {
            color: var(--white);
            font-weight: 700;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        /* ── Layout ── */
        .page {
            padding: 28px 28px 60px;
            max-width: 1180px;
            margin: auto;
        }

        .page-header-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            padding: 5px 12px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: background .15s;
        }

        .back-btn:hover {
            background: var(--bg-page);
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--green-dark);
            margin: 0;
        }


        /* ── Summary card (ข้อมูลทัวร์ + คะแนนรวม) ── */
        .summary-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: #ffffff;
            /* เดิมเป็น var(--bg-hero) เปลี่ยนเป็น #ffffff */
            border: 1px solid #e5e7eb;
            /* เดิมเป็น var(--border) ปรับให้เป็นเส้นเทาอ่อนคลีนๆ */
            border-radius: var(--radius-card);
            padding: 18px 22px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .summary-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .summary-left img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--green-light);
        }

        .summary-left .thumb-fallback {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            background: var(--green-light);
            color: var(--green-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .summary-left .name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .summary-left .meta {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            color: var(--green-dark);
            background: var(--green-light);
            border-radius: 20px;
            padding: 2px 10px;
            margin-top: 6px;
            font-weight: 600;
        }

        .summary-right {
            text-align: center;
            flex-shrink: 0;
        }

        .summary-right .score {
            font-size: 34px;
            font-weight: 700;
            color: var(--green-dark);
            line-height: 1;
        }

        .summary-right .stars {
            display: flex;
            gap: 2px;
            justify-content: center;
            margin: 6px 0 3px;
        }

        .summary-right .stars i {
            font-size: 14px;
        }

        .summary-right .count {
            font-size: 11.5px;
            color: var(--text-hint);
        }

        /* ── Reviews layout: sidebar (sticky) + main ── */
        .reviews-layout {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .reviews-sidebar {
            flex: 0 0 260px;
            position: sticky;
            top: 100px;
            align-self: flex-start;
        }

        .reviews-main {
            flex: 1;
            min-width: 0;
        }

        .reviews-main .panel {
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .reviews-layout {
                flex-direction: column;
            }

            .reviews-sidebar {
                position: static;
                width: 100%;
                flex: 1 1 auto;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 16px 18px;
            box-shadow: var(--shadow-card);
        }

        .panel-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            padding-left: 8px;
            border-left: 3px solid #f59e0b;
            /* เดิมเป็น var(--amber) */
        }



        /* rating bars (สรุปคะแนน) */
        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .rating-row:last-child {
            margin-bottom: 0;
        }

        .rating-row .stars-label {
            display: flex;
            align-items: center;
            gap: 3px;
            width: 34px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .rating-row .stars-label i {
            font-size: 10px;
        }

        .bar-track {
            flex: 1;
            height: 8px;
            background: var(--bg-page);
            border-radius: 4px;
            overflow: hidden;
            display: block;
        }

        .bar-fill {
            height: 100%;
            display: block;
            background: #f59e0b; /* เดิมเป็น var(--amber) */
            border-radius: 4px;
            transition: width .4s ease;
        }

        .rating-count {
            width: 20px;
            text-align: right;
            color: var(--text-hint);
        }

        /* กรองรีวิว - ชิปแนวนอน */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 20px;
            font-family: 'Sarabun', sans-serif;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: all .15s;
            text-decoration: none;
        }

        .filter-chip i {
            font-size: 11px;
        }

        .filter-chip .star-gold {
            color: var(--amber);
        }

        .filter-chip:hover {
            background: var(--bg-page);
        }

        .filter-chip.active {
            background: var(--green-dark);
            border-color: var(--green-dark);
            color: #fff;
        }

        .filter-chip.active .star-gold {
            color: #fff;
        }

        /* ── Review card ── */
        .review-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 18px 20px;
            box-shadow: var(--shadow-card);
            margin-bottom: 14px;
        }

        .review-card:last-child {
            margin-bottom: 0;
        }

        .review-head {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

       .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FFC79C; /* เดิมเป็น var(--amber) */
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .reviewer-name {
            font-weight: 700;
            font-size: 14.5px;
            margin-right: 8px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--green-dark);
            background: var(--green-light);
            border-radius: 20px;
            padding: 2px 9px;
        }

        .review-meta {
            font-size: 11.5px;
            color: var(--text-hint);
            margin-top: 5px;
        }

        .review-stars {
            display: flex;
            gap: 2px;
            margin-bottom: 10px;
        }

        .review-stars i {
            font-size: 13px;
        }

        .review-comment {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-main);
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .review-images-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .review-image {
            width: 130px;
            height: 130px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: opacity .15s;
        }

        .review-image:hover {
            opacity: .88;
        }

        /* ── Star colors ── */
        .star-gold {
            color: #f59e0b;
        }

        .star-empty {
            color: #d9d5cc;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-hint);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* ── Lightbox ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .82);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 10px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, .5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            opacity: .7;
        }

        .lightbox-close:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- ── Navbar ── -->
    <nav class="navbar">
        <a th:href="@{/}" class="brand-logo-link">
            <div class="brand-logo">
                <img th:src="@{/images/logo3.png}" alt="Logo">
            </div>
            <span class="brand-text">ระบบท่องเที่ยวชุมชนชนเผ่า</span>
        </a>
        <div class="nav-dropdown">
            <div class="nav-dropdown-trigger">
                <div class="nav-avatar" th:text="${loggedInManager != null and loggedInManager.firstname != null}
                           ? ${#strings.substring(loggedInManager.firstname,0,1)} : 'CM'">CM</div>
                <span
                    th:text="${loggedInManager != null} ? ${loggedInManager.firstname + ' ' + loggedInManager.lastname} : 'ผู้จัดการ'">ผู้จัดการ</span>
                <i class="fas fa-chevron-down chevron"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dropdown-header">
                    <div class="d-name"
                        th:text="${loggedInManager != null} ? ${loggedInManager.firstname + ' ' + loggedInManager.lastname} : 'ผู้จัดการ'">
                        ชื่อผู้จัดการ</div>
                    <div class="d-role" th:text="${loggedInManager != null} ? ${loggedInManager.email} : ''">
                        manager@community.th</div>
                </div>
                <a class="dropdown-item" th:href="@{/manager/profile}">
                    <i class="fas fa-user-pen"></i> แก้ไขโปรไฟล์
                </a>
                <hr class="dropdown-divider">
                <a class="dropdown-item logout" th:href="@{/logout}">
                    <i class="fas fa-right-from-bracket"></i> ออกจากระบบ
                </a>
            </div>
        </div>
    </nav>

    <!-- ── Page ── -->
    <div class="page">

        <div class="page-header-row">
            <a class="back-btn" th:href="@{/manager/tours}">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </a>
            <h1 class="page-title">รีวิวทัวร์</h1>
        </div>

        <!-- ── Summary card: ข้อมูลทัวร์ + คะแนนรวม ── -->
        <div class="summary-card">
            <div class="summary-left">
                <!-- tour.images เก็บเป็นชื่อไฟล์ คั่นด้วย "||" ต้อง split เอารูปแรก แล้วเติม /uploads/tours/ นำหน้าเอง -->
                <img th:if="${tour.images != null and !#strings.isEmpty(tour.images)}"
                    th:src="@{'/uploads/tours/' + ${#strings.arraySplit(tour.images, '\|\|')[0]}}" alt="รูปทัวร์">
                <div th:unless="${tour.images != null and !#strings.isEmpty(tour.images)}" class="thumb-fallback">
                    <i class="fas fa-mountain-sun"></i>
                </div>
                <div>
                    <div class="name" th:text="${tour.tourmname}">ชื่อทัวร์</div>
                    <div class="meta" th:if="${tour.tourtype != null}">
                        <i class="fas fa-tag"></i>
                        <span th:text="${tour.tourtype.typename}">ประเภททัวร์</span>
                    </div>
                </div>
            </div>
            <div class="summary-right" th:if="${reviews != null and !reviews.isEmpty()}">
                <div class="score" th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">0.0</div>
                <div class="stars">
                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                        <i class="fas fa-star" th:classappend="${i <= avgRating} ? 'star-gold' : 'star-empty'"></i>
                    </th:block>
                </div>
                <div class="count">จาก <span th:text="${reviews.size()}">0</span> รีวิว</div>
            </div>
        </div>

        <!-- ── เนื้อหา: sidebar (sticky) + main (กรอง+รีวิว เลื่อนด้วยกัน) ── -->
        <div class="reviews-layout" th:if="${reviews != null and !reviews.isEmpty()}">

            <!-- ฝั่งซ้าย: สรุปคะแนน (อยู่นิ่ง ไม่เลื่อนตาม) -->
            <div class="reviews-sidebar">
                <div class="panel">
                    <div class="panel-title">สรุปคะแนน</div>
                    <!-- loop จาก entrySet ของ ratingCounts ตรง ๆ (Map เรียง 5→1 มาจาก Service แล้ว) -->
                    <div class="rating-row" th:each="entry : ${ratingCounts}" th:with="star=${entry.key}, cnt=${entry.value},
                                  pct=${reviews.size() > 0 ? (cnt * 100.0 / reviews.size()) : 0}">
                        <span class="stars-label">
                            <span th:text="${star}">5</span>
                            <i class="fas fa-star star-gold"></i>
                        </span>
                        <span class="bar-track">
                            <span class="bar-fill"
                                th:style="'width:' + ${#numbers.formatDecimal(pct, 1, 0)} + '%'"></span>
                        </span>
                        <span class="rating-count" th:text="${cnt}">0</span>
                    </div>
                </div>
            </div>

            <!-- ฝั่งขวา: กรองรีวิว + รายการรีวิว (เลื่อนไปด้วยกัน) -->
            <div class="reviews-main">

                <div class="panel">
                    <div class="panel-title">กรองรีวิว</div>
                    <div class="filter-row" id="filterList">
                        <span class="filter-chip active" data-star="0" onclick="filterReviews(0, this)">
                            <i class="fas fa-list"></i>
                            <span th:text="'ทั้งหมด (' + ${reviews.size()} + ')'">ทั้งหมด (0)</span>
                        </span>
                        <th:block th:each="entry : ${ratingCounts}" th:with="star=${entry.key}, cnt=${entry.value}">
                            <span class="filter-chip" th:attr="data-star=${star}"
                                onclick="filterReviews(this.dataset.star, this)">
                                <i class="fas fa-star star-gold"></i>
                                <span th:text="${star} + ' ดาว (' + ${cnt} + ')'">5 ดาว (0)</span>
                            </span>
                        </th:block>
                    </div>
                </div>

                <!-- รายการรีวิว -->
                <div id="reviewList">
                    <div class="review-card" th:each="review : ${reviews}" th:attr="data-rating=${review.rating}">

                        <div class="review-head">
                            <div class="avatar-circle"
                                th:text="${(review.booking.member.firstname != null ? #strings.substring(review.booking.member.firstname, 0, 1) : '') 
                                           + (review.booking.member.lastname != null ? #strings.substring(review.booking.member.lastname, 0, 1) : '')}">
                                U
                            </div>
                            <div>
                                <span class="reviewer-name"
                                    th:text="${review.booking.member.firstname + ' ' + review.booking.member.lastname}">
                                    ผู้รีวิว</span>
                                <span class="verified-badge">
                                    <i class="fas fa-circle-check"></i> จองผ่านระบบ
                                </span>
                                <div class="review-meta" th:text="${#dates.format(review.reviewdate, 'd MMM yyyy')}">-
                                </div>
                            </div>
                        </div>

                        <div class="review-stars">
                            <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                <i class="fas fa-star"
                                    th:classappend="${i <= review.rating} ? 'star-gold' : 'star-empty'"></i>
                            </th:block>
                        </div>

                        <!-- Comment -->
                        <div class="review-comment"
                            th:if="${review.comment != null and !#strings.isEmpty(review.comment)}"
                            th:text="${review.comment}">-</div>
                        <div class="review-comment" style="color:var(--text-hint); font-style:italic;"
                            th:unless="${review.comment != null and !#strings.isEmpty(review.comment)}">
                            ไม่มีความคิดเห็น
                        </div>

                        <!-- Review images (แสดงได้หลายรูป) -->
                        <div th:if="${review.reviewimages != null and !#strings.isEmpty(review.reviewimages)}"
                            class="review-images-row">
                            <img th:each="imgPath : ${#strings.arraySplit(review.reviewimages, ',')}"
                                class="review-image" th:src="@{${imgPath}}" alt="รูปรีวิว"
                                onclick="openLightbox(this.src)">
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- ── Empty state ── -->
        <div class="empty-state" th:if="${reviews == null or reviews.isEmpty()}">
            <i class="fas fa-star-half-stroke"></i>
            <p>ยังไม่มีรีวิวสำหรับทัวร์นี้</p>
        </div>

    </div>

    <!-- ── Lightbox ── -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close"><i class="fas fa-xmark"></i></span>
        <img id="lightboxImg" src="" alt="รูปรีวิวขยาย">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('open');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

        function filterReviews(star, chipEl) {
            const val = parseInt(star);
            const cards = document.querySelectorAll('#reviewList .review-card');
            cards.forEach(card => {
                const r = parseInt(card.dataset.rating);
                const show = val === 0 || r === val;
                card.style.display = show ? '' : 'none';
            });
            document.querySelectorAll('#filterList .filter-chip').forEach(c => c.classList.remove('active'));
            if (chipEl) chipEl.classList.add('active');
        }
    </script>

</body>

</html>
