<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รีวิวทัวร์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green-dark: #3a7d1e;
            --green-mid: #65a30d;
            --green-light: #d9f99d;
            --amber: #65a30d;
            --amber-hover: #4d7c0a;
            --bg-page: #f3fae8;
            --bg-card: #ffffff;
            --bg-hero: #f4f1e7;
            --border: #e2ddd4;
            --text-main: #1c1c1a;
            --text-muted: #6b6b68;
            --text-hint: #9a9a96;
            --radius-card: 12px;
            --radius-sm: 6px;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.07);
            --red: #c0392b;
            --white: #ffffff;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ── Navbar ── */
        .navbar {
            background: var(--green-dark);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            height: 83px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .25);
        }

        .nav-dropdown {
            position: relative;
            margin-left: auto;
        }

        .nav-dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, .85);
            font-size: .92rem;
            font-weight: 500;
            cursor: pointer;
            padding: .4rem .6rem;
            border-radius: 8px;
            transition: background .2s;
            user-select: none;
        }

        .nav-dropdown-trigger:hover {
            background: rgba(255, 255, 255, .1);
        }

        .nav-dropdown-trigger .chevron {
            font-size: .75rem;
            color: rgba(255, 255, 255, .6);
            transition: transform .2s;
        }

        .nav-dropdown:hover .chevron {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .15);
            border: 1px solid #e8e8e8;
            min-width: 200px;
            padding: 6px 0;
            z-index: 200;
        }

        .nav-dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-header {
            padding: .7rem 1rem .5rem;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 4px;
        }

        .dropdown-header .d-name {
            font-size: .88rem;
            font-weight: 700;
            color: #1a2e1c;
        }

        .dropdown-header .d-role {
            font-size: .78rem;
            color: #6b7c6e;
            margin-top: 1px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: .65rem;
            padding: .6rem 1rem;
            font-size: .88rem;
            color: #333;
            text-decoration: none;
        }

        .dropdown-item:hover {
            background: #eefcda;
            color: var(--green-dark);
        }

        .dropdown-divider {
            border-top: 1px solid #f0f0f0;
            margin: 4px 0;
        }

        .dropdown-item.logout {
            color: #c0392b;
        }

        .nav-avatar {
            width: 36px;
            height: 36px;
            background: var(--amber);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .85rem;
            font-weight: 700;
            color: #fff;
        }

        .brand-logo-link {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin-right: auto;
            text-decoration: none;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .brand-logo img {
            height: 75px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            display: block;
        }

        .brand-text {
            color: var(--white);
            font-weight: 700;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        /* ── Layout ── */
        .page {
            padding: 28px 28px 60px;
            max-width: 1180px;
            margin: auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 16px;
            padding: 5px 12px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: background .15s;
        }

        .back-link:hover {
            background: var(--bg-page);
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--green-dark);
            margin-bottom: 18px;
        }

        /* ── Hero card (ข้อมูลทัวร์ + คะแนนรวม) ── */
        .hero-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: var(--bg-hero);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 18px 22px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .hero-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hero-thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--green-light);
        }

        .hero-thumb-fallback {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: var(--green-light);
            color: var(--green-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .hero-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .hero-meta {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            color: var(--green-dark);
            background: var(--green-light);
            border-radius: 20px;
            padding: 2px 10px;
            margin-top: 6px;
            font-weight: 600;
        }

        .hero-score {
            text-align: center;
            flex-shrink: 0;
        }

        .hero-score .score-num {
            font-size: 34px;
            font-weight: 700;
            color: var(--green-dark);
            line-height: 1;
        }

        .hero-score .star-row {
            display: flex;
            gap: 2px;
            justify-content: center;
            margin: 6px 0 3px;
        }

        .hero-score .star-row i {
            font-size: 14px;
        }

        .hero-score .score-count {
            font-size: 11.5px;
            color: var(--text-hint);
        }

        /* ── Content grid: sidebar + review list ── */
        .content-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 760px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 100px;
        }

        .side-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 16px 18px;
            box-shadow: var(--shadow-card);
        }

        .side-box-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            padding-left: 8px;
            border-left: 3px solid var(--amber);
        }

        /* rating bars */
        .rating-bars {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .rating-row .star-label {
            display: flex;
            align-items: center;
            gap: 3px;
            width: 34px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .rating-row .star-label i {
            font-size: 10px;
        }

        .rating-row .bar-track {
            flex: 1;
            height: 8px;
            background: var(--bg-page);
            border-radius: 4px;
            overflow: hidden;
        }

        .rating-row .bar-fill {
            height: 100%;
            background: var(--amber);
            border-radius: 4px;
            transition: width .4s ease;
        }

        .rating-row .bar-count {
            width: 20px;
            text-align: right;
            color: var(--text-hint);
        }

        /* filter list */
        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 9px 12px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: var(--radius-sm);
            font-family: 'Sarabun', sans-serif;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: all .15s;
        }

        .filter-btn i {
            font-size: 12px;
        }

        .filter-btn .star-gold {
            color: var(--amber);
        }

        .filter-btn:hover {
            background: var(--bg-page);
        }

        .filter-btn.active {
            background: var(--green-dark);
            border-color: var(--green-dark);
            color: #fff;
        }

        .filter-btn.active .star-gold {
            color: #fff;
        }

        /* ── Review card ── */
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .review-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 18px 20px;
            box-shadow: var(--shadow-card);
        }

        .review-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .reviewer-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--amber);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }

        .reviewer-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reviewer-name {
            font-weight: 700;
            font-size: 14.5px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--green-dark);
            background: var(--green-light);
            border-radius: 20px;
            padding: 2px 9px;
        }

        .review-sub-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .star-row {
            display: flex;
            gap: 2px;
        }

        .star-row i {
            font-size: 13px;
        }

        .review-date {
            font-size: 11.5px;
            color: var(--text-hint);
        }

        .review-comment {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-main);
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .review-image {
            width: 100%;
            max-width: 220px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border);
            margin-top: 6px;
            cursor: pointer;
            transition: opacity .15s;
        }

        .review-image:hover {
            opacity: .88;
        }

        /* ── Star colors ── */
        .star-gold {
            color: var(--amber);
        }

        .star-empty {
            color: #d9d5cc;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-hint);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* ── Lightbox ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .82);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 10px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, .5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            opacity: .7;
        }

        .lightbox-close:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- ── Navbar ── -->
    <nav class="navbar">
        <a th:href="@{/}" class="brand-logo-link">
            <div class="brand-logo">
                <img th:src="@{/images/logo3.png}" alt="Logo">
            </div>
            <span class="brand-text">ระบบท่องเที่ยวชุมชนชนเผ่า</span>
        </a>
        <div class="nav-dropdown">
            <div class="nav-dropdown-trigger">
                <div class="nav-avatar" th:text="${loggedInManager != null and loggedInManager.firstname != null}
                           ? ${#strings.substring(loggedInManager.firstname,0,1)} : 'CM'">CM</div>
                <span
                    th:text="${loggedInManager != null} ? ${loggedInManager.firstname + ' ' + loggedInManager.lastname} : 'ผู้จัดการ'">ผู้จัดการ</span>
                <i class="fas fa-chevron-down chevron"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dropdown-header">
                    <div class="d-name"
                        th:text="${loggedInManager != null} ? ${loggedInManager.firstname + ' ' + loggedInManager.lastname} : 'ผู้จัดการ'">
                        ชื่อผู้จัดการ</div>
                    <div class="d-role" th:text="${loggedInManager != null} ? ${loggedInManager.email} : ''">
                        manager@community.th</div>
                </div>
                <a class="dropdown-item" th:href="@{/manager/profile}">
                    <i class="fas fa-user-pen"></i> แก้ไขโปรไฟล์
                </a>
                <hr class="dropdown-divider">
                <a class="dropdown-item logout" th:href="@{/logout}">
                    <i class="fas fa-right-from-bracket"></i> ออกจากระบบ
                </a>
            </div>
        </div>
    </nav>

    <!-- ── Page ── -->
    <div class="page">

        <a class="back-link" th:href="@{/manager/tours}">
            <i class="fas fa-arrow-left"></i> ย้อนกลับ
        </a>

        <div class="page-title">รีวิวทัวร์</div>

        <!-- ── Hero card: ข้อมูลทัวร์ + คะแนนรวม ── -->
        <div class="hero-card">
            <div class="hero-left">
                <!-- tour.images เก็บเป็นชื่อไฟล์ คั่นด้วย "||" (เช่น "a.jpg||b.png||c.jpg")
                     ต้อง split ด้วย || แล้วเติม /uploads/tours/ นำหน้าเอง เพราะ field เก็บแค่ชื่อไฟล์ -->
                <img th:if="${tour.images != null and !#strings.isEmpty(tour.images)}"
                     class="hero-thumb"
                     th:src="@{'/uploads/tours/' + ${#strings.arraySplit(tour.images, '\|\|')[0]}}" alt="รูปทัวร์">
                <div th:unless="${tour.images != null and !#strings.isEmpty(tour.images)}" class="hero-thumb-fallback">
                    <i class="fas fa-mountain-sun"></i>
                </div>
                <div>
                    <div class="hero-name" th:text="${tour.tourmname}">ชื่อทัวร์</div>
                    <div class="hero-meta" th:if="${tour.meetingPointDetail != null and !#strings.isEmpty(tour.meetingPointDetail)}">
                        <i class="fas fa-location-dot"></i>
                        <span th:text="${tour.meetingPointDetail}">สถานที่</span>
                    </div>
                    <div class="hero-tag" th:if="${tour.tourtype != null}">
                        <i class="fas fa-tag"></i>
                        <span th:text="${tour.tourtype.typename}">ประเภททัวร์</span>
                    </div>
                </div>
            </div>
            <div class="hero-score" th:if="${reviews != null and !reviews.isEmpty()}">
                <div class="score-num" th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">0.0</div>
                <div class="star-row">
                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                        <i class="fas fa-star" th:classappend="${i <= avgRating} ? 'star-gold' : 'star-empty'"></i>
                    </th:block>
                </div>
                <div class="score-count" th:text="'จาก ' + ${reviews.size()} + ' รีวิว'">จาก 0 รีวิว</div>
            </div>
        </div>

        <!-- ── Content: sidebar + review list ── -->
        <div class="content-grid" th:if="${reviews != null and !reviews.isEmpty()}">

            <!-- ── Sidebar ── -->
            <aside class="sidebar">

                <!-- สรุปคะแนน -->
                <div class="side-box">
                    <div class="side-box-title">สรุปคะแนน</div>
                    <div class="rating-bars">
                        <!-- loop จาก entrySet ของ ratingCounts ตรง ๆ (Map ที่ Service เตรียมมาเรียง 5→1 อยู่แล้ว)
                             ไม่ lookup ด้วย key ผ่าน bracket [] อีกต่อไป เพราะ Thymeleaf lookup แบบนั้นพลาดได้ -->
                        <th:block th:each="entry : ${ratingCounts}"
                                  th:with="star=${entry.key}, cnt=${entry.value},
                                           pct=${reviews.size() > 0 ? (cnt * 100.0 / reviews.size()) : 0}">
                            <div class="rating-row">
                                <span class="star-label">
                                    <span th:text="${star}">5</span>
                                    <i class="fas fa-star star-gold"></i>
                                </span>
                                <div class="bar-track">
                                    <div class="bar-fill" th:style="'width:' + ${#numbers.formatDecimal(pct, 1, 0)} + '%'"></div>
                                </div>
                                <span class="bar-count" th:text="${cnt}">0</span>
                            </div>
                        </th:block>
                    </div>
                </div>

                <!-- กรองรีวิว -->
                <div class="side-box">
                    <div class="side-box-title">กรองรีวิว</div>
                    <div class="filter-list" id="filterList">
                        <button type="button" class="filter-btn active" data-star="0" onclick="filterReviews(0, this)">
                            <i class="fas fa-list"></i>
                            <span th:text="'ทั้งหมด (' + ${reviews.size()} + ')'">ทั้งหมด (0)</span>
                        </button>
                        <th:block th:each="entry : ${ratingCounts}" th:with="star=${entry.key}, cnt=${entry.value}">
                            <button type="button" class="filter-btn" th:attr="data-star=${star}"
                                    onclick="filterReviews(this.dataset.star, this)">
                                <i class="fas fa-star star-gold"></i>
                                <span th:text="${star} + ' ดาว (' + ${cnt} + ')'">5 ดาว (0)</span>
                            </button>
                        </th:block>
                    </div>
                </div>

            </aside>

            <!-- ── Review list ── -->
            <main>
                <div class="review-list" id="reviewList">

                    <div class="review-card" th:each="review : ${reviews}" th:attr="data-rating=${review.rating}">

                        <div class="review-card-header">
                            <div class="reviewer-avatar" th:text="${review.booking.member.firstname != null}
                                       ? ${#strings.substring(review.booking.member.firstname, 0, 1)}
                                       : 'U'">U</div>
                            <div>
                                <div class="reviewer-name-row">
                                    <span class="reviewer-name"
                                        th:text="${review.booking.member.firstname + ' ' + review.booking.member.lastname}">
                                        ผู้รีวิว</span>
                                    <span class="verified-badge">
                                        <i class="fas fa-circle-check"></i> จองผ่านระบบ
                                    </span>
                                </div>
                                <div class="review-sub-row">
                                    <div class="star-row">
                                        <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                            <i class="fas fa-star"
                                                th:classappend="${i <= review.rating} ? 'star-gold' : 'star-empty'"></i>
                                        </th:block>
                                    </div>
                                    <span class="review-date" th:text="${#temporals.format(review.reviewdate, 'd MMM yyyy')}">-</span>
                                </div>
                            </div>
                        </div>

                        <!-- Comment -->
                        <div class="review-comment" th:if="${review.comment != null and !#strings.isEmpty(review.comment)}"
                            th:text="${review.comment}">-</div>
                        <div class="review-comment" style="color:var(--text-hint); font-style:italic;"
                            th:unless="${review.comment != null and !#strings.isEmpty(review.comment)}">
                            ไม่มีความคิดเห็น
                        </div>

                        <!-- Review image(s) -->
                        <div th:if="${review.reviewimages != null and !#strings.isEmpty(review.reviewimages)}">
                            <img class="review-image"
                                th:src="${#strings.arraySplit(review.reviewimages, ',')[0]}"
                                alt="รูปรีวิว" onclick="openLightbox(this.src)">
                        </div>

                    </div>
                </div>
            </main>
        </div>

        <!-- ── Empty state ── -->
        <div class="empty-state" th:if="${reviews == null or reviews.isEmpty()}">
            <i class="fas fa-star-half-stroke"></i>
            <p>ยังไม่มีรีวิวสำหรับทัวร์นี้</p>
        </div>

    </div>

    <!-- ── Lightbox ── -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close"><i class="fas fa-xmark"></i></span>
        <img id="lightboxImg" src="" alt="รูปรีวิวขยาย">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('open');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

        function filterReviews(star, btnEl) {
            const val = parseInt(star);
            const cards = document.querySelectorAll('#reviewList .review-card');
            cards.forEach(card => {
                const r = parseInt(card.dataset.rating);
                const show = val === 0 || r === val;
                card.style.display = show ? '' : 'none';
            });
            document.querySelectorAll('#filterList .filter-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
        }
    </script>

</body>

</html>
