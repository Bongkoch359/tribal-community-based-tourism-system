<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างโพสต์กิจกรรม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green-dark: #3a7d1e;
            --green-mid: #65a30d;
            --green-light: #d9f99d;
            --amber: #65a30d;
            --amber-hover: #4d7c0a;
            --bg-page: #f3fae8;
            --bg-card: #ffffff;
            --border: #e2ddd4;
            --text-main: #1c1c1a;
            --text-muted: #6b6b68;
            --text-hint: #9a9a96;
            --radius-card: 12px;
            --radius-sm: 6px;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.07);
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ─── NAVBAR ─── */
        .navbar {
            background: var(--green-dark);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            height: 83px;
            gap: .25rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .25);
        }

        .nav-brand {
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: .6rem;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-brand i {
            color: #fff;
            font-size: 1.2rem;
        }

        .nav-dropdown {
            position: relative;
            margin-left: auto;
        }

        .nav-dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, .85);
            font-size: .92rem;
            font-weight: 500;
            cursor: pointer;
            padding: .4rem .6rem;
            border-radius: 8px;
            transition: background .2s;
            user-select: none;
        }

        .nav-dropdown-trigger:hover {
            background: rgba(255, 255, 255, .1);
        }

        .nav-dropdown-trigger .chevron {
            font-size: .75rem;
            color: rgba(255, 255, 255, .6);
            transition: transform .2s;
        }

        .nav-dropdown:hover .chevron {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .15);
            border: 1px solid #e8e8e8;
            min-width: 200px;
            padding: 6px 0;
            z-index: 200;
        }

        .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            right: 0;
            height: 10px;
        }

        .nav-dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-header {
            padding: .7rem 1rem .5rem;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 4px;
        }

        .dropdown-header .d-name {
            font-size: .88rem;
            font-weight: 700;
            color: #1a2e1c;
        }

        .dropdown-header .d-role {
            font-size: .78rem;
            color: #6b7c6e;
            margin-top: 1px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: .65rem;
            padding: .6rem 1rem;
            font-size: .88rem;
            color: #333;
            text-decoration: none;
            transition: background .15s;
        }

        .dropdown-item i {
            width: 16px;
            text-align: center;
            color: #6b7c6e;
            font-size: .85rem;
        }

        .dropdown-item:hover {
            background: #eefcda;
            color: var(--green-dark);
        }

        .dropdown-item:hover i {
            color: var(--green-dark);
        }

        .dropdown-divider {
            border: none;
            border-top: 1px solid #f0f0f0;
            margin: 4px 0;
        }

        .dropdown-item.logout {
            color: #c0392b;
        }

        .dropdown-item.logout i {
            color: #c0392b;
        }

        .dropdown-item.logout:hover {
            background: #fff5f5;
        }

        .nav-avatar {
            width: 36px;
            height: 36px;
            background: var(--amber);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .85rem;
            font-weight: 700;
            color: #fff;
        }

        /* ─── PAGE ─── */
        .page {
            padding: 28px 28px 60px;
            max-width: 1100px;
            margin: auto
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 16px;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--green-dark);
        }

        .back-link svg {
            width: 14px;
            height: 14px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--green-dark);
            margin-bottom: 24px;
        }

        .page-title span {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 16px;
            margin-left: 6px;
        }

        /* ─── FORM GRID ─── */
        .form-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            align-items: start;
        }

        /* ─── CARD ─── */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 20px;
            box-shadow: var(--shadow-card);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        /* ─── IMAGE UPLOAD ─── */
        .img-preview-area {
            width: 100%;
            aspect-ratio: 4/3;
            border: 2px dashed var(--border);
            border-radius: 8px;
            background: #f3fae8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-hint);
            font-size: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .img-preview-area:hover {
            border-color: var(--green-dark);
        }

        .img-preview-area svg {
            width: 32px;
            height: 32px;
            opacity: 0.4;
        }

        /* preview thumbnails */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .preview-thumb {
            position: relative;
            aspect-ratio: 1;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-thumb .remove-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 18px;
            height: 18px;
            background: rgba(0, 0, 0, 0.55);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .file-input-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-main);
            background: #f3fae8;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .file-input-label:hover {
            background: #ece7dc;
        }

        input[type="file"] {
            display: none;
        }

        .file-hint {
            font-size: 11px;
            color: var(--text-hint);
            margin-top: 6px;
        }

        /* ─── RIGHT COLUMN ─── */
        .right-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ─── FORM FIELDS ─── */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-label .req {
            color: #c0392b;
            margin-left: 2px;
        }

        .form-label .opt {
            color: var(--text-hint);
            font-weight: 400;
            margin-left: 4px;
            font-size: 11px;
        }

        .form-control {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            font-size: 13px;
            font-family: 'Sarabun', sans-serif;
            color: var(--text-main);
            background: #fff;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-control::placeholder {
            color: var(--text-hint);
        }

        .form-control:focus {
            border-color: var(--green-dark);
            box-shadow: 0 0 0 3px rgba(26, 92, 42, 0.08);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 110px;
        }

        select.form-control {
            cursor: pointer;
        }

        .form-hint {
            font-size: 11px;
            color: var(--text-hint);
            margin-top: 6px;
        }

        /* ─── TOUR PREVIEW ─── */
        .tour-preview {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            background: #f3fae8;
            border: 1px solid var(--green-light);
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            color: var(--green-dark);
            align-items: center;
            gap: 8px;
        }

        .tour-preview.show {
            display: flex;
        }

        .tour-preview i {
            font-size: 14px;
        }

        /* ─── ACTION BAR ─── */
        .action-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-cancel {
            font-size: 13px;
            font-family: 'Sarabun', sans-serif;
            padding: 9px 20px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .btn-cancel:hover {
            background: #f3fae8;
        }

        .btn-save {
            font-size: 13px;
            font-family: 'Sarabun', sans-serif;
            padding: 9px 22px;
            background: var(--amber);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .btn-save:hover {
            background: var(--amber-hover);
        }

        .btn-save svg {
            width: 14px;
            height: 14px;
        }

        /* ─── ALERT ─── */
        .alert-error {
            background: #fff3f3;
            border: 1px solid #fccaca;
            color: #b91c1c;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: var(--green-light);
            border: 1px solid #a3e635;
            color: var(--green-dark);
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        @media (max-width: 760px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 16px 16px 40px;
            }
        }

        /* ═══ SUCCESS MODAL ═══ */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 30, 12, 0.55);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-backdrop.show {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 36px 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
            transform: scale(0.85) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
        }

        .modal-backdrop.show .modal-box {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .checkmark-wrap {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a3d1f, #2d6a35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(26, 61, 31, 0.35);
            position: relative;
        }

        .checkmark-wrap::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid rgba(26, 61, 31, 0.15);
        }

        .checkmark-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(26, 61, 31, 0.08);
            animation: ring-pulse 1.5s ease-out 0.4s both;
        }

        @keyframes ring-pulse {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .checkmark-icon {
            font-size: 36px;
            color: #fff;
            animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        @keyframes pop-in {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d6a2d;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .modal-btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #2d6a2d;
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Sarabun', sans-serif;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .modal-btn-primary:hover {
            background: #3d8c3d;
        }

        .modal-progress-bar {
            height: 3px;
            background: #e8f4ea;
            border-radius: 0 0 20px 20px;
            margin: 24px -36px -32px;
            overflow: hidden;
        }

        .modal-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #65a30d, #2d6a2d);
            border-radius: 3px;
            width: 100%;
            transform-origin: left;
            animation: progress-drain 2s linear forwards;
        }

        @keyframes progress-drain {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }
    </style>
</head>

<body>

    <!-- ═══ NAVBAR ═══ -->
    <nav class="navbar">
        <a class="nav-brand" th:href="@{/}">
            <i class="fas fa-mountain-sun"></i>
            ระบบท่องเที่ยวชุมชนชนเผ่า
        </a>

        <div class="nav-dropdown">
            <div class="nav-dropdown-trigger">
                <div class="nav-avatar" th:text="${loggedInManager != null and loggedInManager.firstname != null}
                           ? ${#strings.substring(loggedInManager.firstname,0,1) + (#strings.length(loggedInManager.lastname) > 0 ? #strings.substring(loggedInManager.lastname,0,1) : '')}
                           : 'CM'">CM</div>
                <span
                    th:text="${loggedInManager != null} ? ${loggedInManager.firstname + ' ' + loggedInManager.lastname} : 'ผู้จัดการชุมชน'">ผู้จัดการชุมชน</span>
                <i class="fas fa-chevron-down chevron"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dropdown-header">
                    <div class="d-name"
                        th:text="${loggedInManager != null} ? ${loggedInManager.firstname + ' ' + loggedInManager.lastname} : 'ผู้จัดการชุมชน'">
                        ผู้จัดการชุมชน</div>
                    <div class="d-role" th:text="${loggedInManager != null} ? ${loggedInManager.email} : ''">
                        manager@community.th</div>
                </div>
                <a th:href="@{/manager/profile}" class="dropdown-item">
                    <i class="fas fa-user-pen"></i>
                    แก้ไขโปรไฟล์
                </a>
                <hr class="dropdown-divider">
                <a th:href="@{/logout}" class="dropdown-item logout">
                    <i class="fas fa-right-from-bracket"></i>
                    ออกจากระบบ
                </a>
            </div>
        </div>
    </nav>

    <!-- Thymeleaf pass message to JS -->
    <div id="serverMsg" th:data-success="${successMessage}" style="display:none;"></div>

    <!-- ═══ SUCCESS MODAL ═══ -->
    <div class="modal-backdrop" id="successModal">
        <div class="modal-box">
            <div class="checkmark-wrap">
                <div class="checkmark-ring"></div>
                <i class="fas fa-check checkmark-icon"></i>
            </div>
            <div class="modal-title">บันทึกโพสต์สำเร็จ!</div>
            <div class="modal-desc" id="modalDesc">โพสต์ถูกบันทึกเรียบร้อยแล้ว</div>
            <div class="modal-btn-row">
                <button class="modal-btn-primary"
                    onclick="document.getElementById('successModal').classList.remove('show')">
                    <i class="fas fa-check"></i> ตกลง
                </button>
            </div>
            <div class="modal-progress-bar">
                <div class="modal-progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <!-- ═══ PAGE ═══ -->
    <div class="page">

        <a class="back-link" th:href="@{/manager/posts}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            ย้อนกลับ
        </a>

        <div class="page-title">
            เพิ่มโพสต์กิจกรรม
        </div>

        <!-- Alert -->
        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/manager/posts/create}" method="post" id="postForm">

            <!-- hidden: images base64 -->
            <input type="hidden" name="images" id="imagesInput" />

            <div class="form-grid">

                <!-- ── LEFT: รูปภาพ ── -->
                <div>
                    <!-- Image upload card -->
                    <div class="card">
                        <div class="card-title">รูปภาพโพสต์</div>

                        <!-- Preview area (click to trigger file input) -->
                        <div class="img-preview-area" id="dropZone"
                            onclick="document.getElementById('fileInput').click()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <polyline points="21 15 16 10 5 21" />
                            </svg>
                            <span>คลิกเพื่อเลือกรูปภาพ</span>
                        </div>

                        <!-- Thumbnails -->
                        <div class="preview-grid" id="previewGrid"></div>

                        <!-- File input -->
                        <input type="file" id="fileInput" accept="image/*" multiple />
                        <label for="fileInput" class="file-input-label">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                            อัปโหลดรูปภาพ
                        </label>
                        <div class="file-hint">เลือกได้หลายรูป (jpg, png, webp)</div>
                    </div>
                </div>

                <!-- ── RIGHT: ข้อมูลโพสต์ + รายละเอียด ── -->
                <div class="right-col">

                    <!-- ข้อมูลหลัก -->
                    <div class="card">
                        <div class="card-title">ข้อมูลโพสต์</div>

                        <div class="form-group">
                            <label class="form-label">หัวข้อโพสต์ <span class="req">*</span></label>
                            <input class="form-control" type="text" name="title"
                                placeholder="เช่น แนะนำแหล่งท่องเที่ยวชุมชนชนเผ่า..."
                                th:value="${post?.title}" required />
                        </div>

                        <!-- ═══ โพสนี้เป็นของทัวร์อะไร ═══ -->
                        <div class="form-group" style="margin-bottom:0">
                            <label class="form-label">
                                    เลือกทัวร์ <span class="opt">(ไม่บังคับ —
                                    เว้นว่างไว้ถ้าเป็นข่าวสาร/ประกาศทั่วไป)</span>
                            </label>
                            <select class="form-control" name="tourId" id="tourSelect">
                                <option value="">-- ไม่ระบุทัวร์ (ข่าวสาร/ประกาศทั่วไป) --</option>
                                <option th:each="t : ${tours}" th:value="${t.tourid}"
                                    th:text="${t.tourmname + ' (' + (t.getTourDuration() ?: '-') + ')'}"
                                    th:selected="${post?.tour?.tourid == t.tourid}">
                                    ชื่อทัวร์
                                </option>
                            </select>
                            <!-- <div class="form-hint">
                                หากเลือกทัวร์ โพสต์นี้จะอยู่ภายใต้ทัวร์ดังกล่าว และผู้ใช้งานสามารถกด "จองทัวร์"
                                จากหน้าโพสต์ได้
                            </div> -->
                            

                            <!-- ฟิลด์สถานที่ (แสดงเฉพาะเมื่อเลือกทัวร์) -->
                            <div class="form-group" id="locationGroup" style="display:none;">
                                <label class="form-label">สถานที่ <span class="req">*</span></label>
                                <input class="form-control" type="text" name="location" id="locationInput"
                                    placeholder="จังหวัด / สถานที่ท่องเที่ยว" th:value="${post?.location}" />
                            </div>
                        </div>
                    </div>

                    <!-- รายละเอียด -->
                    <div class="card">
                        <div class="card-title">รายละเอียด</div>
                        <div class="form-group" style="margin-bottom:0">
                            <textarea class="form-control" name="description"
                                placeholder="อธิบายโปรแกรมกิจกรรม จุดเด่น หรือโปรโมชัน..."
                                th:text="${post?.description}"></textarea>
                        </div>
                    </div>

                </div>
            </div>

            <!-- ── ACTION BAR ── -->
            <div class="action-bar">
                <a class="btn-cancel" th:href="@{/manager/posts}">✕ ยกเลิก</a>
                <button type="submit" class="btn-save">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    บันทึกโพสต์
                </button>
            </div>

        </form>
    </div>

    <script>
        // ── รูปภาพ base64 ──
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');
        const imagesInput = document.getElementById('imagesInput');
        const dropZone = document.getElementById('dropZone');

        let base64List = []; // เก็บ base64 ทุกรูป

        fileInput.addEventListener('change', function () {
            const files = Array.from(this.files);
            files.forEach(file => readAndAdd(file));
            this.value = ''; // reset เพื่อให้เลือกซ้ำได้
        });

        function readAndAdd(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const b64 = e.target.result; // data:image/...;base64,...
                base64List.push(b64);
                renderPreviews();
                updateHiddenInput();
            };
            reader.readAsDataURL(file);
        }

        function renderPreviews() {
            previewGrid.innerHTML = '';
            // ถ้ามีรูปให้ซ่อน dropZone placeholder text
            dropZone.querySelector('svg').style.opacity = base64List.length ? '0' : '0.4';
            dropZone.querySelector('span').style.display = base64List.length ? 'none' : '';

            base64List.forEach((b64, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'preview-thumb';

                const img = document.createElement('img');
                img.src = b64;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'remove-btn';
                btn.innerHTML = '✕';
                btn.onclick = () => {
                    base64List.splice(idx, 1);
                    renderPreviews();
                    updateHiddenInput();
                };

                wrap.appendChild(img);
                wrap.appendChild(btn);
                previewGrid.appendChild(wrap);
            });
        }

        function updateHiddenInput() {
            // เก็บหลายรูปโดยคั่นด้วย || 
            imagesInput.value = base64List.join('||');
        }

        // Validate ก่อน submit
        document.getElementById('postForm').addEventListener('submit', function (e) {
            if (base64List.length === 0) {
                // อนุญาตให้บันทึกได้แม้ไม่มีรูป (optional)
                imagesInput.value = '';
            }
        });

        // ── แสดง/ซ่อนฟิลด์สถานที่ ตามการเลือกทัวร์ ──
        // เลือกทัวร์ -> แสดงฟิลด์สถานที่ (บังคับกรอก)
        // ไม่ระบุทัวร์ (ข่าวสารทั่วไป) -> ซ่อนฟิลด์สถานที่ (ไม่บังคับกรอก)
        const tourSelect = document.getElementById('tourSelect');
        const locationGroup = document.getElementById('locationGroup');
        const locationInput = document.getElementById('locationInput');

        function toggleLocationField() {
            if (tourSelect.value) {
                locationGroup.style.display = '';
                locationInput.setAttribute('required', 'required');
            } else {
                locationGroup.style.display = 'none';
                locationInput.removeAttribute('required');
                locationInput.value = '';
            }
        }
        tourSelect.addEventListener('change', toggleLocationField);
        toggleLocationField(); // เผื่อกรณีแก้ไขโพสต์ที่มีทัวร์อยู่แล้ว

        // ─── Auto-show modal ถ้ามี successMessage ───
        (function () {
            const el = document.getElementById('serverMsg');
            const msg = el ? el.dataset.success : null;
            if (!msg || msg === 'null' || msg.trim() === '') return;

            const modal = document.getElementById('successModal');
            const desc = document.getElementById('modalDesc');
            const fill = document.getElementById('progressFill');

            desc.textContent = msg;
            modal.classList.add('show');

            fill.style.animation = 'none';
            fill.offsetHeight;
            fill.style.animation = 'progress-drain 2s linear forwards';

            // ปิด modal แล้ว redirect ไปหน้า list
            setTimeout(() => {
                modal.classList.remove('show');
                window.location.href = '/manager/posts';
            }, 2000);
        })();
    </script>

</body>

</html>
