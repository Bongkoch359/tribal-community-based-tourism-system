<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบผู้จัดการ – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #f0ece3;
      color: #1e2d1a;
      min-height: 100vh;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAVBAR ─── */
    .navbar {
      background: #1e4d2b;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
    }
    .nav-brand i { font-size: 1.15rem; }

    .nav-right a {
      color: rgba(255,255,255,.85);
      font-size: .92rem;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .15s;
    }
    .nav-right a:hover { color: #fff; }
    .nav-right i { font-size: .85rem; }

    /* ─── PAGE BODY ─── */
    .page-body {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ─── FORM CARD ─── */
    .form-card {
      background: #fff;
      border-radius: 14px;
      padding: 40px 44px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }

    /* ─── HEADER ─── */
    .form-card-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .form-card-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #1e2d1a;
      margin-bottom: 6px;
    }
    .form-card-header p {
      font-size: .92rem;
      color: #7a7060;
    }

    /* ─── ALERT ─── */
    .alert-error {
      background: #fff3f3;
      border: 1px solid #fccaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: .9rem;
      margin-bottom: 20px;
    }

    /* ─── FORM ─── */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: .88rem;
      font-weight: 600;
      color: #3a3a3a;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      border: 1.5px solid #d6d1c8;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: .95rem;
      font-family: 'Sarabun', sans-serif;
      color: #1e2d1a;
      background: #fff;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .form-control::placeholder { color: #b0a898; }
    .form-control:focus {
      border-color: #e08a00;
      box-shadow: 0 0 0 3px rgba(224,138,0,.13);
    }

    /* ─── SUBMIT ─── */
    .btn-submit {
      width: 100%;
      background: #e08a00;
      border: none;
      border-radius: 8px;
      padding: 13px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      margin-top: 6px;
      transition: background .18s;
      letter-spacing: .02em;
    }
    .btn-submit:hover { background: #c47700; }
    .btn-submit:active { background: #a86400; }

    @media (max-width: 480px) {
      .form-card { padding: 28px 20px 32px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="nav-brand" href="/search">
    <i class="fas fa-mountain-sun"></i>
    ระบบท่องเที่ยวชุมชนชนเผ่า
  </a>
  <div class="nav-right">
    <a href="/search">
      <i class="fas fa-house"></i>
      หน้าแรก
    </a>
  </div>
</nav>

<!-- BODY -->
<div class="page-body">
  <div class="form-card">

    <div class="form-card-header">
      <h1>เข้าสู่ระบบ</h1>
      <p>ด้วยบัญชีผู้จัดการท่องเที่ยวชุมชน</p>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/manager/login}" method="post">
      <div class="form-group">
        <label class="form-label">อีเมล</label>
        <input class="form-control" type="email" name="email"
               placeholder="กรอกอีเมล" required/>
      </div>

      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <input class="form-control" type="password" name="password"
               placeholder="กรอกรหัสผ่าน" required/>
      </div>

      <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
    </form>

  </div>
</div>

</body>
</html>
