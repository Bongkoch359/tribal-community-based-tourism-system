<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบผู้จัดการ – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green-dark: #006e2f;
      /* primary (เดิม navbar/avatar/footer #3a7d1e) */
      --green-mid: #22c55e;
      /* primary-container (เดิม focus/link #65a30d, #95d5b2) */
      --green-light: #6bff8f;
      /* primary-fixed (เดิม footer text #d8f3dc) */
      --orange: #ff8e4d;
      /* tertiary-container (เดิมปุ่ม submit #f0a500) */
      --bg: #faf7ef;
      /* พื้นหลังหน้า (เดิม #f3fae8) */
      --text-muted: #3d4a3d;
      --white: #ffffff;
      --border: #e4e0d4;
      /* เส้นขอบ input (เดิม #d6d1c8) */
      --text-main: #0b1c30;
      /* สีหัวข้อ (เดิม #1e2d1a) */
      --text-hint: #6d7b6c;
      /* สี subtitle (เดิม #7a7060) */
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAVBAR ─── */
    .navbar {
      background: var(--green-dark);
      height: 90px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      justify-content: space-between;
      border-bottom: 4px solid transparent;
      border-image: linear-gradient(to right, #f7b733, #e8850a) 1;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
    }

    .nav-brand i {
      font-size: 1.15rem;
    }

    .nav-right a {
      color: rgba(255, 255, 255, .85);
      font-size: .92rem;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .15s;
    }

    .nav-right a:hover {
      color: #fff;
    }

    .nav-right i {
      font-size: .85rem;
    }

    /* ─── PAGE BODY ─── */
    .page-body {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ─── FORM CARD ─── */
    .form-card {
      background: #fff;
      border-radius: 14px;
      padding: 40px 44px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .10);
    }

    /* ─── AVATAR ─── */
    .login-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: var(--green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .login-avatar i {
      color: #ffffff;
      font-size: 42px;
    }

    .brand-logo-link {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-right: auto;
      text-decoration: none;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      height: 100%;
    }

    .brand-logo img {
      height: 110px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      display: block;
    }

    .brand-text {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.05rem;
      white-space: nowrap;
    }


    /* ─── HEADER ─── */
    .form-card-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .form-card-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-card-header p {
      font-size: .92rem;
      color: var(--text-hint);
    }

    /* ─── ALERT ─── */
    .alert-error {
      background: #fff3f3;
      border: 1px solid #fccaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: .9rem;
      margin-bottom: 20px;
    }

    /* ─── FORM ─── */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: .88rem;
      font-weight: 600;
      color: #3a3a3a;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: .95rem;
      font-family: 'Sarabun', sans-serif;
      color: var(--text-main);
      background: #fff;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }

    .form-control::placeholder {
      color: #b0a898;
    }

    .form-control:focus {
      border-color: var(--green-mid);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .15);
    }

    /* ─── PASSWORD FIELD WITH EYE TOGGLE ─── */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper .form-control {
      padding-right: 44px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9a9284;
      font-size: 1.05rem;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .15s;
    }

    .password-toggle:hover {
      color: var(--green-dark);
    }

    .password-toggle:focus {
      outline: none;
    }

    /* ─── SUBMIT ─── */
    .btn-submit {
      width: 100%;
      background: var(--orange);
      border: none;
      border-radius: 8px;
      padding: 13px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      margin-top: 6px;
      transition: background .18s;
      letter-spacing: .02em;
    }

    .btn-submit:hover {
      background: #e6702c;
    }

    .btn-submit:active {
      background: var(--green-dark);
    }

    @media (max-width: 480px) {
      .form-card {
        padding: 28px 20px 32px;
      }
    }

    /* ─── ALERT ─── */
    .alert-success {
      background: var(--green-light);
      border: 1px solid #a3e635;
      color: var(--green-dark);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .footer {
      padding: 1rem 2rem;
      background: var(--green-dark);
      color: var(--green-light);
      font-size: 0.9rem;
      margin-top: auto;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer a {
      color: var(--green-mid);
      text-decoration: none;
      margin-left: 8px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a th:href="@{/}" class="brand-logo-link">
      <div class="brand-logo">
        <img th:src="@{/images/logo5.png}" alt="Logo">
      </div>
      <span class="brand-text">ระบบท่องเที่ยวชุมชนชนเผ่า</span>
    </a>
    <div class="nav-right">
      <a href="/search">
        <i class="fas fa-house"></i>
        หน้าแรก
      </a>
    </div>
  </nav>

  <!-- BODY -->
  <div class="page-body">
    <div class="form-card">

      <div class="login-avatar">
        <i class="fas fa-user"></i>
      </div>

      <div class="form-card-header">
        <h1>เข้าสู่ระบบ</h1>
        <p>ด้วยบัญชีผู้จัดการท่องเที่ยวชุมชน</p>
      </div>

      <!-- Error Message -->
      <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

      <form th:action="@{/manager/login}" method="post">
        <div class="form-group">
          <label class="form-label">อีเมล</label>
          <input class="form-control" type="email" name="email" placeholder="กรอกอีเมล" required />
        </div>

        <div class="form-group">
          <label class="form-label">รหัสผ่าน</label>
          <div class="password-wrapper">
            <input class="form-control" type="password" id="managerPassword" name="password" placeholder="กรอกรหัสผ่าน"
              required />
            <button type="button" class="password-toggle" onclick="toggleManagerPassword()"
              aria-label="แสดง/ซ่อนรหัสผ่าน">
              <i class="fas fa-eye" id="managerPasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
      </form>

    </div>
  </div>
  <!-- ═══ FOOTER ═══ -->
  <footer class="footer">
    <div class="footer-content">
      <span>© 2026 ระบบท่องเที่ยวชุมชนชนเผ่า</span>
      <span>
        Version 1.0 |
        <a href="#"><i class="fas fa-circle-question"></i> Help</a> |
        <a href="#"><i class="fas fa-headset"></i> ติดต่อแอดมิน</a>
      </span>
    </div>
  </footer>

  <script>
    function toggleManagerPassword() {
      const input = document.getElementById('managerPassword');
      const icon = document.getElementById('managerPasswordIcon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.classList.toggle('fa-eye', !isHidden);
      icon.classList.toggle('fa-eye-slash', isHidden);
    }
  </script>

</body>

</html>
