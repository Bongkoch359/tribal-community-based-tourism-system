<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบผู้จัดการ – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link th:href="@{/css/Tour/login-tour.css}" rel="stylesheet">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a th:href="@{/}" class="brand-logo-link">
      <div class="brand-logo">
        <img th:src="@{/images/logo5.png}" alt="Logo">
      </div>
      <span class="brand-text">ชนเผ่าพาเที่ยว</span>
    </a>
    <div class="nav-right">
      <a href="/search">
        <i class="fas fa-house"></i>
        หน้าแรก
      </a>
    </div>
  </nav>

  <!-- BODY -->
  <div class="page-body">
    <div class="form-card">

      <div class="login-avatar">
        <i class="fas fa-user"></i>
      </div>

      <div class="form-card-header">
        <h1>เข้าสู่ระบบ</h1>
        <p>ด้วยบัญชีผู้จัดการท่องเที่ยวชุมชน</p>
      </div>

      <!-- Error Message -->
      <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

      <form th:action="@{/manager/login}" method="post">
        <div class="form-group">
          <label class="form-label">อีเมล</label>
          <input class="form-control" type="email" name="email" placeholder="กรอกอีเมล" required />
        </div>

        <div class="form-group">
          <label class="form-label">รหัสผ่าน</label>
          <div class="password-wrapper">
            <input class="form-control" type="password" id="managerPassword" name="password" placeholder="กรอกรหัสผ่าน"
              required />
            <button type="button" class="password-toggle" onclick="toggleManagerPassword()"
              aria-label="แสดง/ซ่อนรหัสผ่าน">
              <i class="fas fa-eye" id="managerPasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
      </form>

    </div>
  </div>
  <!-- ═══ FOOTER ═══ -->
  <footer class="footer">
    <div class="footer-content">
      <span>© 2026 ระบบท่องเที่ยวชุมชนชนเผ่า</span>
      <span>
        Version 1.0 |
        <a href="#"><i class="fas fa-circle-question"></i> Help</a> |
        <a href="#"><i class="fas fa-headset"></i> ติดต่อแอดมิน</a>
      </span>
    </div>
  </footer>
  <script>
    function toggleManagerPassword() {
      const input = document.getElementById('managerPassword');
      const icon = document.getElementById('managerPasswordIcon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.classList.toggle('fa-eye', !isHidden);
      icon.classList.toggle('fa-eye-slash', isHidden);
    }
  </script>

</body>

</html>
