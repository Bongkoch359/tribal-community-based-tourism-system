<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบการจัดการ – ท่องเที่ยวชุมชนชนเผ่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'TH Sarabun New', 'TH Sarabun PSK', 'Sarabun', sans-serif;
    }

    :root {
      --primary: #006c49;
      --primary-container: #10b981;
      --on-primary: #ffffff;
      --on-primary-container: #00422b;
      
      --secondary: #2b6954;
      --secondary-container: #adedd3;
      
      --background: #f4fbf4;
      --surface: #f4fbf4;
      --surface-container-low: #eef6ee;
      --surface-container: #e8f0e9;
      --surface-container-lowest: #ffffff;
      --surface-variant: #dde4dd;
      
      --on-surface: #161d19;
      --on-surface-variant: #3c4a42;
      --outline: #6c7a71;
      --outline-variant: #bbcabf;
      
      --error: #ba1a1a;
      --error-container: #ffdad6;
      --on-error-container: #93000a;
      
      --navbar-h: 90px;
      --r-md: 10px;
      --r-lg: 16px;
    }

    html { scroll-behavior: smooth; }
    body {
      background-color: var(--surface-container-low);
      color: var(--on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    button, input, select, textarea { 
      font-family: 'TH Sarabun New', 'TH Sarabun PSK', 'Sarabun', sans-serif; 
    }
    button { cursor: pointer; }

    /* ══════════════════ NAVBAR ══════════════════ */
    .navbar {
      background: var(--primary);
      height: var(--navbar-h);
      display: flex;
      align-items: center;
      padding: 0 5% 0 3%;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0, 108, 73, 0.15);
    }
    .navbar-brand {
      color: var(--on-primary);
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 0px;
    }

    /* ขนาดโลโก้ตามที่กำหนด */
    .brand-logo {
      width: 160px;
      height: 110px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-name { display: flex; flex-direction: column;margin-left: -25px; }
 .brand-name-line1 {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
}

.brand-name-line2 {
  display: block;
  font-size: 12px;
  color: var(--secondary-container); /* หรือใช้ #adedd3 / rgba(255, 255, 255, 0.8) */
  margin-top: 4px;
}
    .nav-link {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* ══════════════════ PAGE BODY / ฟอร์ม ══════════════════ */
    .page-body {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Background Blurs */
    .bg-blur-1 {
      position: absolute;
      width: 500px; height: 500px;
      background: rgba(173, 237, 211, 0.35);
      border-radius: 50%;
      filter: blur(100px);
      top: -100px; right: -100px;
      pointer-events: none;
    }
    .bg-blur-2 {
      position: absolute;
      width: 450px; height: 450px;
      background: rgba(16, 185, 129, 0.15);
      border-radius: 50%;
      filter: blur(90px);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    /* FORM CARD */
    .form-card {
      background: var(--surface-container-lowest);
      border-radius: var(--r-lg);
      padding: 38px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--surface-variant);
      position: relative;
      z-index: 10;
    }

    .form-card-header { margin-bottom: 24px; text-align: center; }
    .form-card-header .header-icon {
      width: 56px; height: 56px;
      background: var(--surface-container);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
    }
    .form-card-header .header-icon .material-symbols-outlined {
      font-size: 28px;
      color: var(--primary);
    }
    .form-card-header h1 { 
      font-size: 24px; 
      font-weight: 700; 
      color: var(--on-surface); 
      margin-bottom: 4px; 
    }
    .form-card-header p { 
      font-size: 16px; 
      color: var(--on-surface-variant); 
    }

    /* ALERTS */
    .alert {
      border-radius: 8px; 
      padding: 10px 14px;
      font-size: 15px; 
      margin-bottom: 18px;
      display: flex; 
      align-items: center; 
      gap: 8px;
    }
    .alert-error { 
      background: var(--error-container); 
      color: var(--on-error-container); 
      border: 1px solid #fca5a5; 
    }
    .alert-success { 
      background: #f0fdf4; 
      color: #15803d; 
      border: 1px solid #bbf7d0; 
    }
    .alert .material-symbols-outlined { font-size: 18px; }

    /* FORM GROUPS */
    .form-group { margin-bottom: 18px; }
    .form-label { 
      display: block; 
      font-size: 16px; 
      font-weight: 700; 
      color: var(--on-surface); 
      margin-bottom: 6px; 
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; 
      left: 12px; 
      top: 50%; 
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--outline);
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-wrap:focus-within .input-icon {
      color: var(--primary);
    }

    .form-control {
      width: 100%;
      border: 1px solid var(--outline-variant);
      border-radius: 8px;
      padding: 11px 12px 11px 40px;
      font-size: 16px;
      color: var(--on-surface);
      background: var(--surface-container-lowest);
      outline: none;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 108, 73, 0.12);
    }
    .form-control::placeholder { 
      color: rgba(60, 74, 66, 0.5); 
      font-size: 15px; 
    }

    .form-control.input-error {
      border-color: var(--error);
      background: #fff8f8;
    }

    /* SUBMIT BUTTON */
    .btn-submit {
      width: 100%;
      background: var(--primary);
      border: none; 
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--on-primary); 
      font-size: 18px; 
      font-weight: 700;
      cursor: pointer;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      margin-top: 24px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 2px 6px rgba(0, 108, 73, 0.2);
    }
    .btn-submit:hover { 
      background: #005a3c; 
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 108, 73, 0.25);
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit .material-symbols-outlined { font-size: 20px; }

    /* FOOTER */
    .footer {
      background: var(--primary);
      padding: 16px 5%;
      color: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }
    .footer-text {
      font-weight: 400;
    }

    @media (max-width: 768px) {
      .navbar { height: auto; min-height: 80px; padding: 10px 4%; }
      .brand-logo { width: 120px; height: 90px; }
      .brand-name-line1 { font-size: 20px; }
      .brand-name-line2 { font-size: 12px; }
      .form-card { padding: 30px 20px; }
      .footer { flex-direction: column; gap: 6px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="/" class="navbar-brand">
      <div class="brand-logo">
        <img th:src="@{/images/logo5.png}" alt="ตราสัญลักษณ์ระบบท่องเที่ยวชุมชนชนเผ่า">
      </div>
      <div class="brand-name">
        <span class="brand-name-line1">ระบบท่องเที่ยวชุมชนชนเผ่า</span>
        <span class="brand-name-line2">Tribal Community-Based Tourism System</span>
      </div>
    </a>
    
    <nav>
      <a href="/" class="nav-link">
        <span class="material-symbols-outlined">home</span>
        หน้าแรก
      </a>
    </nav>
  </header>

  <!-- Page Body -->
  <main class="page-body">
    <div class="bg-blur-1"></div>
    <div class="bg-blur-2"></div>

    <div class="form-card">
      <div class="form-card-header">
        <div class="header-icon">
          <span class="material-symbols-outlined">admin_panel_settings</span>
        </div>
        <h1>เข้าสู่ระบบการจัดการ</h1>
        <p>กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบผู้ดูแล</p>
      </div>

      <!-- Server Alert -->
      <div th:if="${message}"
           th:text="${message}"
           th:class="'alert ' + (${alertType} == 'error' ? 'alert-error' : 'alert-success')">
      </div>

      <!-- Client Alert -->
      <div id="js-alert" class="alert alert-error" style="display: none;"></div>

      <form action="/admin/login" method="post" id="admin-login-form" novalidate>
        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">ชื่อผู้ใช้</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">person</span>
            <input type="text" name="username" id="username" class="form-control" placeholder="กรอกชื่อผู้ใช้ของคุณ" autocomplete="username"/>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">รหัสผ่าน</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password"/>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">
          <span>เข้าสู่ระบบ</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-text">ระบบท่องเที่ยวชุมชนเผ่า v1.0</span>
    <span class="footer-text">© 2025 — สงวนลิขสิทธิ์</span>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.getElementById('admin-login-form');
      var username = document.getElementById('username');
      var password = document.getElementById('password');
      var jsAlert = document.getElementById('js-alert');

      [username, password].forEach(function (input) {
        input.addEventListener('input', function () {
          if (this.value.trim() !== '') {
            this.classList.remove('input-error');
          }
          if (username.value.trim() !== '' && password.value.trim() !== '') {
            hideAlert();
          }
        });
      });

      form.addEventListener('submit', function (e) {
        var uVal = username.value.trim();
        var pVal = password.value.trim();

        username.classList.remove('input-error');
        password.classList.remove('input-error');
        hideAlert();

        var serverAlerts = document.querySelectorAll('.form-card .alert:not(#js-alert)');
        serverAlerts.forEach(function (el) { el.style.display = 'none'; });

        if (!uVal && !pVal) {
          e.preventDefault();
          username.classList.add('input-error');
          password.classList.add('input-error');
          showAlert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
          username.focus();
        } else if (!uVal) {
          e.preventDefault();
          username.classList.add('input-error');
          showAlert('กรุณากรอกชื่อผู้ใช้');
          username.focus();
        } else if (!pVal) {
          e.preventDefault();
          password.classList.add('input-error');
          showAlert('กรุณากรอกรหัสผ่าน');
          password.focus();
        }
      });

      function showAlert(msg) {
        jsAlert.textContent = msg;
        jsAlert.style.display = 'flex';
      }

      function hideAlert() {
        jsAlert.textContent = '';
        jsAlert.style.display = 'none';
      }
    });
  </script>
</body>
</html>
