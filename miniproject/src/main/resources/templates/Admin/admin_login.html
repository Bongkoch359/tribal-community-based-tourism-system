<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - ระบบท่องเที่ยวชุมชนเผ่า</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  body {
    font-family: 'Sarabun', sans-serif;
    background: #ffffff; 
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: #333;
  }

  .navbar {
    background: #0a1f12;
    padding: 0 5%;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  
  .navbar-brand {
    color: #ffffff;
    font-weight: 700;
    font-size: 22px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-icon {
    width: 48px;
    height: 48px;
    background: #3d9e68;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  
  .navbar-right a {
    color: rgba(255,255,255,0.45);
    font-size: 16px;
    text-decoration: none;
    font-weight: 500;
    transition: 0.15s;
    padding: 10px 20px;
    border-radius: 10px;
  }
  .navbar-right a:hover { 
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.8); 
  }

  .page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: #f8f9fa;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    border: 1px solid #eee;
  }

  .card-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  
  .card-subtitle {
    text-align: center;
    font-size: 16px;
    color: #888;
    margin-bottom: 32px;
  }

  .message {
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: 600;
  }
  .message.success {
    background: #eefbf3;
    border: 1px solid #c3e6cb;
    color: #1e4d2b;
  }
  .message.error {
    background: #fff5f5;
    border: 1px solid #fbc2c2;
    color: #c0392b;
  }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 16px;
    color: #444;
    margin-bottom: 8px;
    font-weight: 600;
  }
  
  .form-group input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: 'Sarabun', sans-serif;
    color: #333;
    outline: none;
    background: #fcfcfc;
    transition: all 0.2s ease;
  }
  
  .form-group input:focus {
    border-color: #0a1f12;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(10, 31, 18, 0.08);
  }

  .form-group input.input-error {
    border-color: #fca5a5;
    background: #fff8f8;
  }
  .form-group input.input-error:focus {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
  }

  .btn-submit {
    width: 100%;
    background: #0a1f12;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
}
.btn-submit:hover { 
    background: #14321e;
    transform: translateY(-1px);
    box-shadow: 0 6px 12px rgba(10, 31, 18, 0.3);
}
  .btn-submit:active { transform: translateY(0); }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="navbar-brand">
    <div class="brand-icon">🏔️</div>
    ระบบท่องเที่ยวชุมชนเผ่า
  </a>
  <div class="navbar-right">
    <a href="/">🏠 หน้าหลัก</a>
  </div>
</nav>

<div class="page">
  <div class="card">
    <h1 class="card-title">เข้าสู่ระบบ</h1>
    <p class="card-subtitle">แผงควบคุมผู้ดูแลระบบ</p>

    <!-- ข้อความจาก server (flash attribute: message / alertType) -->
    <div th:if="${message}"
         th:text="${message}"
         th:class="'message ' + ${alertType}">
    </div>

    <!-- ข้อความฝั่ง client (กันกรอกว่างก่อนยิงไป server) -->
    <div id="js-alert" class="message error" style="display:none;"></div>

    <form action="/admin/login" method="post" id="admin-login-form" novalidate>
      <div class="form-group">
        <label>ชื่อผู้ใช้</label>
        <input type="text" name="username" id="username" placeholder="ระบุชื่อผู้ใช้ของคุณ" />
      </div>

      <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" name="password" id="password" placeholder="ระบุรหัสผ่าน" />
      </div>

      <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<script>
  document.getElementById('admin-login-form').addEventListener('submit', function (e) {
    var username = document.getElementById('username');
    var password = document.getElementById('password');

    username.classList.remove('input-error');
    password.classList.remove('input-error');
    hideJsAlert();

    if (!username.value.trim() || !password.value.trim()) {
      e.preventDefault();
      if (!username.value.trim()) username.classList.add('input-error');
      if (!password.value.trim()) password.classList.add('input-error');
      showJsAlert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
    }
  });

  function showJsAlert(msg) {
    var box = document.getElementById('js-alert');
    box.textContent = msg;
    box.style.display = 'block';
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideJsAlert() {
    document.getElementById('js-alert').style.display = 'none';
  }
</script>

</body>
</html>
