<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - ระบบท่องเที่ยวชุมชนเผ่า</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── โทนเขียวมะกอกอมเขียว (Olive Green) เหมือนหน้า Dashboard ── */
    --teal-900: #263821;
    --teal-800: #304527;
    --teal-700: #3c5630;
    --teal-600: #4a6b3a;
    --teal-500: #5c8444;
    --teal-400: #719f51;
    --teal-100: #e3eed9;
    --teal-50:  #f1f7ec;

    --gold-700: #92681b;
    --gold-600: #b3822a;
    --gold-500: #d4a13b;
    --gold-400: #e7b94f;
    --gold-100: #fbedce;

    --red-700:   #b8332e;
    --red-100:   #fbe3e1;

    --neutral-800: #26302c;
    --neutral-700: #3d4945;
    --neutral-600: #5b6864;
    --neutral-500: #7c8985;
    --neutral-400: #a4b0ac;
    --neutral-300: #cdd6d2;
    --neutral-200: #e4ebe8;
    --neutral-100: #f4f8f6;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--neutral-100);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--neutral-800);
  }

  /* ── NAVBAR (เหมือนหน้า dashboard) ── */
  .navbar {
    background: linear-gradient(120deg, var(--teal-600), var(--teal-700));
    padding: 0 5%;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .navbar-brand {
    color: #ffffff;
    font-weight: 700;
    font-size: 22px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--teal-400), var(--teal-600));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(74,107,58,0.35);
  }

  .navbar-right a {
    color: rgba(255,255,255,0.45);
    font-size: 16px;
    text-decoration: none;
    font-weight: 500;
    transition: 0.15s;
    padding: 10px 20px;
    border-radius: 10px;
  }
  .navbar-right a:hover {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.85);
  }

  /* ── PAGE / CARD ── */
  .page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: var(--neutral-100);
  }

  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(60,86,48,0.08);
    border: 1px solid var(--neutral-200);
  }

  .card-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--neutral-800);
    margin-bottom: 8px;
  }

  .card-subtitle {
    text-align: center;
    font-size: 16px;
    color: var(--neutral-500);
    margin-bottom: 32px;
  }

  .message {
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: 600;
  }
  .message.success {
    background: var(--teal-50);
    border: 1px solid var(--teal-100);
    color: var(--teal-700);
  }
  .message.error {
    background: var(--red-100);
    border: 1px solid #f3b3b0;
    color: var(--red-700);
  }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 16px;
    color: var(--neutral-700);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .form-group input {
    width: 100%;
    border: 1px solid var(--neutral-300);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: 'Sarabun', sans-serif;
    color: var(--neutral-800);
    outline: none;
    background: var(--neutral-100);
    transition: all 0.2s ease;
  }

  .form-group input:focus {
    border-color: var(--teal-600);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(74, 107, 58, 0.12);
  }

  .form-group input.input-error {
    border-color: #f3b3b0;
    background: #fff8f8;
  }
  .form-group input.input-error:focus {
    border-color: var(--red-700);
    box-shadow: 0 0 0 3px rgba(184,51,46,0.12);
  }

  .btn-submit {
    width: 100%;
    background: linear-gradient(120deg, var(--teal-600), var(--teal-700));
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
  }
  .btn-submit:hover {
    background: linear-gradient(120deg, var(--teal-700), var(--teal-800));
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(60,86,48,0.3);
  }
  .btn-submit:active { transform: translateY(0); }

  /* ── FOOTER (เหมือนหน้า dashboard) ── */
  .footer {
    background: linear-gradient(120deg, var(--teal-700), var(--teal-600));
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 14px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-text { font-size: 12px; color: rgba(255,255,255,0.3); }

  @media (max-width: 768px) {
    .navbar { height: auto; padding: 14px 5%; flex-wrap: wrap; gap: 12px; }
    .footer { flex-direction: column; gap: 4px; text-align: center; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="navbar-brand">
    <div class="brand-icon">🏔️</div>
    ระบบท่องเที่ยวชุมชนเผ่า
  </a>
  <div class="navbar-right">
    <a href="/">🏠 หน้าหลัก</a>
  </div>
</nav>

<div class="page">
  <div class="card">
    <h1 class="card-title">เข้าสู่ระบบ</h1>
    <p class="card-subtitle">แผงควบคุมผู้ดูแลระบบ</p>

    <!-- ข้อความจาก server (flash attribute: message / alertType) -->
    <div th:if="${message}"
         th:text="${message}"
         th:class="'message ' + ${alertType}">
    </div>

    <!-- ข้อความฝั่ง client (กันกรอกว่างก่อนยิงไป server) -->
    <div id="js-alert" class="message error" style="display:none;"></div>

    <form action="/admin/login" method="post" id="admin-login-form" novalidate>
      <div class="form-group">
        <label>ชื่อผู้ใช้</label>
        <input type="text" name="username" id="username" placeholder="ระบุชื่อผู้ใช้ของคุณ" />
      </div>

      <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" name="password" id="password" placeholder="ระบุรหัสผ่าน" />
      </div>

      <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<footer class="footer">
  <span class="footer-text">ระบบท่องเที่ยวชุมชนเผ่า v1.0</span>
  <span class="footer-text">© 2025 — สงวนลิขสิทธิ์</span>
</footer>

<script>
  document.getElementById('admin-login-form').addEventListener('submit', function (e) {
    var username = document.getElementById('username');
    var password = document.getElementById('password');

    username.classList.remove('input-error');
    password.classList.remove('input-error');
    hideJsAlert();

    if (!username.value.trim() || !password.value.trim()) {
      e.preventDefault();
      if (!username.value.trim()) username.classList.add('input-error');
      if (!password.value.trim()) password.classList.add('input-error');
      showJsAlert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
    }
  });

  function showJsAlert(msg) {
    var box = document.getElementById('js-alert');
    box.textContent = msg;
    box.style.display = 'block';
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideJsAlert() {
    document.getElementById('js-alert').style.display = 'none';
  }
</script>

</body>
</html>
