<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างบัญชีผู้จัดการ - ระบบท่องเที่ยวชุมชนเผ่า</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-700: #215c35;
    --green-600: #2d7a4f;
    --green-500: #3d9e68;
    --green-100: #d8f3dc;
    --green-50:  #f0faf4;
    --amber-700: #a16207;
    --amber-100: #fef3c7;
    --red-700:   #b91c1c;
    --red-100:   #fee2e2;
    --neutral-800: #292524;
    --neutral-700: #44403c;
    --neutral-600: #57534e;
    --neutral-500: #78716c;
    --neutral-400: #a8a29e;
    --neutral-300: #d6d3d1;
    --neutral-200: #e7e5e4;
    --neutral-100: #f5f5f4;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--neutral-100);
    color: var(--neutral-800);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAVBAR ── */
  .navbar {
    background: #0a1f12;
    height: 100px;
    display: flex;
    align-items: center;
    padding: 0 5%;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .navbar-brand {
    color: #fff;
    font-weight: 700;
    font-size: 22px;
    text-decoration: none;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .brand-icon {
    width: 48px;
    height: 48px;
    background: var(--green-500);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .nav-group { display: flex; align-items: center; gap: 6px; }

  .nav-link {
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    font-size: 17px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 10px;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .nav-link:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
  .nav-link.active { background: rgba(255,255,255,0.09); color: #fff; }

  .nav-divider { width: 1px; height: 36px; background: rgba(255,255,255,0.08); margin: 0 12px; }

  .admin-area { display: flex; align-items: center; gap: 14px; }
  .admin-info { text-align: right; }
  .admin-name { color: rgba(255,255,255,0.8); font-size: 15px; font-weight: 600; line-height: 1.2; }
  .admin-role { color: rgba(255,255,255,0.3); font-size: 12px; }

  .admin-avatar {
    width: 46px; height: 46px; background: var(--amber-700); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: var(--amber-100); flex-shrink: 0;
  }

  .logout-btn {
    color: rgba(255,255,255,0.25); text-decoration: none; font-size: 13px;
    font-weight: 500; transition: color 0.15s; white-space: nowrap;
  }
  .logout-btn:hover { color: rgba(255,255,255,0.7); }

  /* ── CONTENT ── */
  .content { max-width: 850px; margin: 0 auto; padding: 40px 24px; flex: 1; width: 100%; }

  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--green-700);
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 20px;
    transition: 0.2s;
  }
  .btn-back:hover { color: var(--amber-700); }

  /* CARD */
  .card {
    background: var(--white);
    border-radius: 20px;
    padding: 45px;
    border: 1px solid var(--neutral-200);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 35px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--neutral-200);
  }

  .card-header h2 { font-size: 24px; font-weight: 700; color: var(--neutral-800); }

  /* MESSAGE */
  .message {
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    margin-bottom: 25px;
    text-align: center;
    font-weight: 500;
  }
  .message.success { background: var(--green-50); border: 1px solid var(--green-600); color: var(--green-700); }
  .message.error { background: var(--red-100); border: 1px solid var(--red-700); color: var(--red-700); }

  /* FORM UI */
  .section-label {
    font-size: 13px;
    color: var(--amber-700);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 18px;
    margin-top: 30px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--neutral-200);
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 15px;
    color: var(--neutral-700);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .form-group input, .form-group select {
    width: 100%;
    border: 1.5px solid var(--neutral-200);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 15px;
    font-family: 'Sarabun', sans-serif;
    color: var(--neutral-800);
    outline: none;
    background: var(--neutral-100);
    transition: all 0.2s;
  }

  .form-group input:focus {
    border-color: var(--green-600);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(45, 122, 79, 0.08);
  }

  .required { color: var(--red-700); margin-left: 4px; }

  /* BUTTONS */
  .btn-row {
    display: flex;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 35px;
    padding-top: 26px;
    border-top: 1px solid var(--neutral-200);
  }

  .btn-cancel {
    background: var(--white);
    border: 1.5px solid var(--neutral-200);
    color: var(--neutral-600);
    border-radius: 12px;
    padding: 13px 28px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-cancel:hover { background: var(--neutral-100); }

  .btn-submit {
    background: var(--green-600);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px 32px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .btn-submit:hover { background: var(--green-700); transform: translateY(-2px); }

  /* ── FOOTER ── */
  .footer {
    background: #0a1f12;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 14px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-text { font-size: 12px; color: rgba(255,255,255,0.25); }

  @media (max-width: 768px) {
    .navbar { height: auto; padding: 14px 5%; flex-wrap: wrap; gap: 12px; }
    .nav-group { flex-wrap: wrap; gap: 4px; }
    .footer { flex-direction: column; gap: 4px; text-align: center; }
  }

  @media (max-width: 600px) {
    .row { grid-template-columns: 1fr; gap: 0; }
    .card { padding: 25px; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="/admin/dashboard" class="navbar-brand">
    <div class="brand-icon">🏔️</div>
    ระบบท่องเที่ยวชุมชนเผ่า
  </a>

  <div class="nav-group">
    <a href="/admin/dashboard" class="nav-link">📊 Dashboard</a>
    <a href="/admin/manager"   class="nav-link active">👥 จัดการผู้จัดการ</a>
    <a href="/admin/homestay"  class="nav-link">🏠 จัดการโฮมสเตย์</a>
  </div>

  <div class="nav-divider"></div>

  <div class="admin-area">
    <div class="admin-info">
      <div class="admin-name" th:text="${session.loggedInAdmin?.username ?: 'Administrator'}">Administrator</div>
      <div class="admin-role">Super Admin</div>
    </div>
    <div class="admin-avatar">A</div>
    <a href="/admin/logout" class="logout-btn">ออกจากระบบ</a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="content">
  <a href="/admin/manager" class="btn-back">← กลับไปยังหน้ารายชื่อ</a>

  <div class="card">
    <div class="card-header">
      <span style="font-size:28px;">👤</span>
      <h2>สร้างบัญชีผู้จัดการใหม่</h2>
    </div>

    <div th:if="${message}" th:text="${message}" th:class="'message ' + ${alertType}"></div>

    <form action="/admin/manager/create" method="post">

      <div class="section-label">ข้อมูลส่วนบุคคล</div>
      <div class="row">
        <div class="form-group">
          <label>ชื่อ <span class="required">*</span></label>
          <input type="text" name="firstname" placeholder="ระบุชื่อภาษาไทย" required />
        </div>
        <div class="form-group">
          <label>นามสกุล <span class="required">*</span></label>
          <input type="text" name="lastname" placeholder="ระบุนามสกุลภาษาไทย" required />
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>เบอร์โทรศัพท์ <span class="required">*</span></label>
          <input type="tel" name="phone" placeholder="0xx-xxx-xxxx" required />
        </div>
        <div class="form-group">
          <label>ชุมชนที่รับผิดชอบ <span class="required">*</span></label>
          <input type="text" name="tribe" placeholder="เช่น ชุมชนบ้านป่าเหมี้ยง" required />
        </div>
      </div>

      <div class="section-label">ข้อมูลความปลอดภัย</div>
      <div class="form-group">
        <label>อีเมล (ใช้เป็น Username) <span class="required">*</span></label>
        <input type="email" name="email" placeholder="example@tourism.com" required />
      </div>

      <div class="row">
        <div class="form-group">
          <label>กำหนดรหัสผ่าน <span class="required">*</span></label>
          <input type="password" name="password" id="pwd" placeholder="ระบุรหัสผ่าน 8 ตัวขึ้นไป" required />
        </div>
        <div class="form-group">
          <label>ยืนยันรหัสผ่านอีกครั้ง <span class="required">*</span></label>
          <input type="password" name="confirmPassword" id="cpwd" placeholder="ระบุรหัสผ่านให้ตรงกัน" required />
        </div>
      </div>

      <div class="btn-row">
        <a href="/admin/manager" class="btn-cancel">ยกเลิก</a>
        <button type="submit" class="btn-submit">➕ ยืนยันการสร้างบัญชี</button>
      </div>
    </form>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <span class="footer-text">ระบบท่องเที่ยวชุมชนเผ่า v1.0</span>
  <span class="footer-text">© 2025 — สงวนลิขสิทธิ์</span>
</footer>

<script>
  // ตรวจสอบรหัสผ่านก่อนส่งฟอร์ม
  document.querySelector('form').addEventListener('submit', function(e) {
    const pwd  = document.getElementById('pwd').value;
    const cpwd = document.getElementById('cpwd').value;
    if (pwd !== cpwd) {
      e.preventDefault();
      alert('ขออภัย: รหัสผ่านทั้งสองช่องไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง');
    }
    if (pwd.length < 8) {
        e.preventDefault();
        alert('รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร');
    }
  });
</script>
</body>
</html>
